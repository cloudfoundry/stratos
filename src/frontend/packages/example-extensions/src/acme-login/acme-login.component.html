<app-intro-screen class="acme-login login__busy" [ngClass]="{'acme-login__busy': busy$ | async }">
  <app-card class="login__card mat-elevation-z">
    <app-stratos-title></app-stratos-title>
    <div class="acme-login__body">
      <div class="acme-login__form-outer" [ngClass]="{'acme-login-sso': ssoLogin}">
        <form class="acme-login__form" name="loginForm" (ngSubmit)="login()" #loginForm="ngForm">
          @if (!ssoLogin) {
            <app-form-field>
              <input appInput required [(ngModel)]="username" name="username" placeholder="Username" autocomplete="username">
            </app-form-field>
          }
          @if (!ssoLogin) {
            <app-form-field>
              <input appInput required type="password" [(ngModel)]="password" name="password" placeholder="Password" autocomplete="current-password">
            </app-form-field>
          }
          @if (!loggedIn) {
            <button class="login__submit btn btn-primary" type="submit" [disabled]="!ssoLogin && !loginForm.valid">Login</button>
          }
        </form>
      </div>
      <div class="acme-login__loading">
        <app-progress-bar mode="indeterminate"></app-progress-bar>
      </div>
    </div>
  </app-card>
  <div class="acme-login-message" [ngClass]="{'login-message--show': !!message, 'login-message-error': this.error}">
    {{ message }}
  </div>
  <div class="acme-login__footer">
    <div class="acme-login__copyright">
      @if (config.copyright) {
        <span [innerHTML]="config.copyright"></span>
      }
    </div>
    <div class="acme-login__logo">
      <img src="/core/assets/custom/acme_logo.png">
    </div>
  </div>
</app-intro-screen>
