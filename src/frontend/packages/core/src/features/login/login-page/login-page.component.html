<app-intro-screen 
  id="app-login-page" 
  class="login-page min-h-screen flex items-center justify-center" 
  [ngClass]="{'opacity-50 pointer-events-none': busy$ | async }"
  [ngStyle]="{
    'background-image': loginBackground$ | async,
    'background-color': loginBackgroundColor$ | async,
    'background-size': 'cover',
    'background-position': 'center',
    'background-repeat': 'no-repeat'
  }"
>
  <div 
    class="login-card card w-full max-w-md mx-4 p-8 rounded-lg shadow-lg"
    [ngStyle]="{
      'background-color': loginCardBackground$ | async
    }"
  >
    <app-stratos-title class="mb-8"></app-stratos-title>

    <div class="login-body">
      <div class="login-form-outer" [ngClass]="{'login-sso': ssoLogin}">
        <form class="login-form space-y-6" name="loginForm" (ngSubmit)="login()" #loginForm="ngForm">
          <div *ngIf="!ssoLogin" class="space-y-1">
            <label for="username" class="sr-only">Username</label>
            <input
              id="username"
              class="input w-full"
              required
              [(ngModel)]="username"
              name="username"
              placeholder="Username"
              type="text"
            >
          </div>

          <div *ngIf="!ssoLogin" class="space-y-1 relative">
            <label for="password" class="sr-only">Password</label>
            <input
              id="password"
              class="input w-full pr-12"
              required
              [type]="!showPassword ? 'password' : 'text'"
              [(ngModel)]="password"
              name="password"
              placeholder="Password"
            >
            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
              <app-show-hide-button (changed)="showPassword = $event"></app-show-hide-button>
            </div>
          </div>

          <button
            class="btn btn-primary w-full py-3"
            *ngIf="!loggedIn"
            type="submit"
            [disabled]="!ssoLogin && !loginForm.valid"
          >
            Sign In
          </button>
        </form>
      </div>

      <div id="login-loading" class="login-loading mt-4" [class.hidden]="!(busy$ | async)">
        <div class="progress">
          <div class="progress-bar w-full animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <div
    id="login-error-message"
    class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300"
    [ngClass]="{
      'translate-y-0 opacity-100': !!message,
      '-translate-y-full opacity-0': !message,
      'alert alert-danger': error,
      'alert alert-info': !error
    }"
  >
    {{ message }}
  </div>
</app-intro-screen>
