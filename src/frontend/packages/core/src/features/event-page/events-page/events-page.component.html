<app-page-header>
  <h1 *ngIf="endpointOnly">Endpoint Notifications</h1>
  <h1 *ngIf="!endpointOnly">Notifications</h1>
  <div class="page-header-right">
    <span>
      <button class="btn btn-icon" type="button" matTooltip="Close" [routerLink]="back$ | async">
        <app-custom-icon>close</app-custom-icon>
      </button>
    </span>
  </div>
</app-page-header>
<div class="event-page">
  <div *ngIf="hasReadEvents$ | async ; else defaultHeader"
       class="event-page__filter inline-flex rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-1 shadow-sm"
       role="group"
       aria-label="filter">
    <button type="button"
            class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200"
            [class.bg-blue-600]="(selectedFilterSubject | async) === filterValues.UNREAD"
            [class.text-white]="(selectedFilterSubject | async) === filterValues.UNREAD"
            [class.text-gray-700]="(selectedFilterSubject | async) !== filterValues.UNREAD"
            [class.dark:text-gray-300]="(selectedFilterSubject | async) !== filterValues.UNREAD"
            [class.hover:bg-gray-100]="(selectedFilterSubject | async) !== filterValues.UNREAD"
            [class.dark:hover:bg-gray-700]="(selectedFilterSubject | async) !== filterValues.UNREAD"
            (click)="selectedFilterSubject.next(filterValues.UNREAD)"
            [attr.aria-pressed]="(selectedFilterSubject | async) === filterValues.UNREAD">
      Unread
    </button>
    <button type="button"
            class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200"
            [class.bg-blue-600]="(selectedFilterSubject | async) === filterValues.READ"
            [class.text-white]="(selectedFilterSubject | async) === filterValues.READ"
            [class.text-gray-700]="(selectedFilterSubject | async) !== filterValues.READ"
            [class.dark:text-gray-300]="(selectedFilterSubject | async) !== filterValues.READ"
            [class.hover:bg-gray-100]="(selectedFilterSubject | async) !== filterValues.READ"
            [class.dark:hover:bg-gray-700]="(selectedFilterSubject | async) !== filterValues.READ"
            (click)="selectedFilterSubject.next(filterValues.READ)"
            [attr.aria-pressed]="(selectedFilterSubject | async) === filterValues.READ">
      Read
    </button>
    <button type="button"
            class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200"
            [class.bg-blue-600]="(selectedFilterSubject | async) === filterValues.ALL"
            [class.text-white]="(selectedFilterSubject | async) === filterValues.ALL"
            [class.text-gray-700]="(selectedFilterSubject | async) !== filterValues.ALL"
            [class.dark:text-gray-300]="(selectedFilterSubject | async) !== filterValues.ALL"
            [class.hover:bg-gray-100]="(selectedFilterSubject | async) !== filterValues.ALL"
            [class.dark:hover:bg-gray-700]="(selectedFilterSubject | async) !== filterValues.ALL"
            (click)="selectedFilterSubject.next(filterValues.ALL)"
            [attr.aria-pressed]="(selectedFilterSubject | async) === filterValues.ALL">
      All
    </button>
  </div>
  <ng-template #defaultHeader>
    <h2 class="event-page__unread-header">Unread</h2>
  </ng-template>

  <div class="event-page__list space-y-2"
       [ngClass]="{'event-page__list-has-read': hasReadEvents$ | async}"
       *ngIf="events$ | async as events"
       role="list">
    <app-card class="event-page__event-row-card" *ngFor="let event of events">
      <div class="event-page__event-row flex items-center gap-4 p-4" role="listitem">
        <app-stateful-icon class="event-page__event-row-icon flex-shrink-0" [state]="event.stratosStatus">
        </app-stateful-icon>
        <span class="event-page__event-message flex-1 text-sm text-gray-900 dark:text-gray-100">{{event.message}}</span>
        <button class="event-page__event-row-button btn btn-primary" type="button" *ngIf="event.link"
          [routerLink]="event.link" [queryParams]="createQueryParams(event.link) | async">View</button>
        <button class="event-page__event-row-button btn btn-primary" type="button" *ngIf="event.read"
          (click)="updateReadState(event, false)">Mark as unread</button>
        <button class="event-page__event-row-button btn btn-primary" type="button" *ngIf="!event.read"
          (click)="updateReadState(event, true)">Mark as read</button>
      </div>
    </app-card>
    <app-card class="event-page__no-event-message" *ngIf="events.length === 0">
      <div class="p-4 text-center text-sm text-gray-600 dark:text-gray-400" role="listitem">
        <div *ngIf="endpointOnly">You have no unread endpoint notifications.</div>
        <div *ngIf="!endpointOnly">You have no unread notifications.</div>
      </div>
    </app-card>
  </div>
</div>
