<nav class="page-side-nav" [ngClass]="{'page-side-nav__desktop': !(isMobile$ | async)}">
  <div class="page-side-nav__items-header">
    {{ header }}
  </div>
  <div class="page-side-nav__items-compact-header">
    <app-custom-icon class="page-side-nav__items-compact-dropdown">arrow_drop_down</app-custom-icon>
    <small> {{ header }}</small>
    <div class="page-side-nav__items-compact-tab-label"> {{ activeTab$ | async }}</div>
  </div>
  <ul class="page-side-nav__items">
    <li tabindex="1" *ngFor="let tab of tabs">
      <div *ngIf="tab && !tab.link" class="page-side-nav__item-sep">{{ tab?.label }}</div>
      <a *ngIf="tab && tab.link && (!tab.hidden$ || !(tab.hidden$ | async))" class="page-side-nav__item"
        [routerLink]="[tab.link]" [routerLinkActive]="['page-side-nav__item--active']">
        <app-custom-icon class="page-side-nav__icon" *ngIf="tab.icon" [fontSet]="tab.iconFont">{{ tab.icon }}
        </app-custom-icon>
        <app-custom-icon class="page-side-nav__icon" *ngIf="!tab.icon"></app-custom-icon>
        <span>{{ tab?.label }}</span>
      </a>
    </li>
  </ul>
</nav>
