<nav class="page-side-nav" [ngClass]="{'page-side-nav__desktop': (isMobile$ | async) === false}"
  [attr.aria-label]="header() || null">
  <div class="page-side-nav__items-header">
    {{ header() }}
  </div>
  <!-- Below the desktop width the tabs fold into this dropdown. -->
  <button #compactToggle type="button" class="page-side-nav__items-compact-header"
    [attr.aria-expanded]="open()" aria-controls="page-side-nav-items" (click)="open.set(!open())">
    <app-custom-icon class="page-side-nav__items-compact-dropdown" aria-hidden="true">arrow_drop_down</app-custom-icon>
    <small> {{ header() }}</small>
    <span class="page-side-nav__items-compact-tab-label"> {{ activeTab$ | async }}</span>
  </button>
  <ul id="page-side-nav-items" class="page-side-nav__items" [class.page-side-nav__items--open]="open()">
    @for (tab of shownTabs(); track tab.link || tab.label) {
      @if (tab && !tab.link) {
        <li>
          <div class="page-side-nav__item-sep">{{ tab?.label }}</div>
        </li>
      }
      <!-- null = the gate has not answered yet; keep the tab out until it does. -->
      @if (tab && tab.link && (tab.hidden$ | async) === false) {
        <li>
          <a class="page-side-nav__item"
            [attr.data-test]="'page-tab-' + tab.label"
            [routerLink]="[tab.link]" queryParamsHandling="preserve"
            [routerLinkActive]="['page-side-nav__item--active']" ariaCurrentWhenActive="page"
            (click)="open.set(false)">
            @if (tab.icon) {
              <app-custom-icon class="page-side-nav__icon" [fontSet]="tab.iconFont" aria-hidden="true">{{ tab.icon }}
              </app-custom-icon>
            }
            @if (!tab.icon) {
              <app-custom-icon class="page-side-nav__icon" aria-hidden="true"></app-custom-icon>
            }
            <span>{{ tab?.label }}</span>
          </a>
        </li>
      }
    }
  </ul>
</nav>
