<nav class="nav h-full flex flex-col bg-nav-bg text-nav-text shadow-lg">
  <div class="nav-inner flex-1 flex flex-col">
    <!-- Navigation Header -->
    <div class="nav-top p-4 border-b border-nav-border" *ngIf="!environment.fixedSideNav">
      <div class="nav-top-inner flex items-center justify-between">
        <button
          class="nav-logo flex items-center space-x-3"
          [class.justify-center]="iconMode"
          (click)="toggleSidenavMode()"
          [title]="iconMode ? 'Expand sidebar' : ''"
        >
          <img
            class="nav-logo-img h-8 w-8 flex-shrink-0 rounded-lg"
            [src]="iconMode ? (navLogoIcon$ | async) : (navLogo$ | async)"
            [alt]="displayName$ | async"
          >
          <div class="nav-logo-text text-nav-text font-bold text-lg truncate" [class.hidden]="iconMode">
            {{ displayName$ | async }}
          </div>
        </button>
        <button
          class="nav-toggle p-2 text-nav-text hover:bg-nav-hover rounded-lg transition-all duration-200"
          (click)="toggleSidenavMode()"
          [class.hidden]="iconMode"
          title="Collapse sidebar"
        >
          <span class="material-icons text-lg">
            chevron_left
          </span>
        </button>
      </div>
    </div>


    <!-- Navigation Items -->
    <ul class="nav-items flex-1 py-2 space-y-1">
      <li *ngFor="let tab of tabs" class="nav-item-container">
        <a
          *ngIf="!tab.hidden || !(tab.hidden | async)"
          class="nav-item nav-item-link flex items-center pl-0 pr-3 py-3 text-nav-muted hover:text-nav-text hover:bg-nav-hover transition-all duration-200 relative group"
          [class.nav-item--active]="isActiveRoute(tab.link)"
          [class.bg-nav-active]="isActiveRoute(tab.link)"
          [class.text-nav-text]="isActiveRoute(tab.link)"
          [routerLink]="[tab.link]"
          [routerLinkActive]="['router-link-active']"
          [title]="iconMode ? tab.label : ''"
        >
          <span class="nav-item-icon flex-shrink-0 h-6 w-6 flex items-center justify-center ml-4">
            <span class="material-icons text-xl">{{ getIconName(tab) }}</span>
          </span>
          <span class="nav-item-label ml-3 truncate font-medium" [class.hidden]="iconMode">
            {{ tab.label }}
          </span>
          <!-- Active indicator - now touches the left edge -->
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-accent rounded-r-full transform transition-all duration-200"
               [class.scale-y-100]="isActiveRoute(tab.link)"
               [class.scale-y-0]="!isActiveRoute(tab.link)">
          </div>
          <!-- Hover effect for icon mode -->
          <div class="absolute left-full ml-2 px-2 py-1 bg-nav-tooltip text-nav-text text-sm rounded-md opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap z-50"
               [class.hidden]="!iconMode">
            {{ tab.label }}
          </div>
        </a>
      </li>
    </ul>

    <!-- User Profile Section -->
    <div class="nav-profile border-t border-nav-border p-3 relative">
      <button
        class="profile-button w-full flex items-center p-2 text-nav-muted hover:text-nav-text hover:bg-nav-hover rounded-lg transition-all duration-200 relative"
        [class.justify-center]="iconMode"
        (click)="toggleProfileMenu()"
        [title]="iconMode ? 'Profile menu' : ''"
      >
        <span class="material-icons text-xl flex-shrink-0">
          account_circle
        </span>
        <div class="profile-info ml-3 flex-1 text-left" [class.hidden]="iconMode">
          <div class="profile-name text-sm font-medium text-nav-text truncate">
            User Profile
          </div>
          <div class="profile-role text-xs text-nav-muted truncate">
            Click to sign out
          </div>
        </div>
        <span class="material-icons text-sm ml-2" [class.hidden]="iconMode">
          {{ showProfileMenu ? 'expand_less' : 'expand_more' }}
        </span>
      </button>

      <!-- Profile Context Menu -->
      <div
        class="profile-menu absolute bottom-full left-0 right-0 mb-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg shadow-lg z-50"
        [class.hidden]="!showProfileMenu"
        [class.opacity-0]="!showProfileMenu"
        [class.opacity-100]="showProfileMenu"
        style="transition: opacity 0.2s ease"
      >
        <div class="py-2">
          <button
            class="profile-menu-item w-full px-4 py-2 text-left text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center"
            (click)="signOut()"
          >
            <span class="material-icons text-lg mr-3">
              logout
            </span>
            Sign Out
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Footer -->
    <div class="nav-bottom p-4 border-t border-nav-border" *ngIf="!!customizations.copyright">
      <div class="nav-copyright text-nav-muted text-xs text-center" [class.hidden]="iconMode">
        <div class="nav-copyright-icon inline">&copy;</div>
        <div class="nav-copyright-text inline ml-1" [innerHTML]="customizations.copyright"></div>
      </div>
    </div>
  </div>
</nav>
