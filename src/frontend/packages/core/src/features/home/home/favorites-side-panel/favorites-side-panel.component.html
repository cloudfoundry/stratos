<app-sidepanel-preview title="Favorites for {{name}}">
  @if (favorites$ | async; as favs) {
    <div>
      @for (entity of favs; track entity) {
        <app-favorites-meta-card class="fav-side-panel__card" [favoriteEntity]="entity"></app-favorites-meta-card>
      }
    </div>
  }
</app-sidepanel-preview>
