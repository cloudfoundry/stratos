<div class="card hover:shadow-md transition-shadow duration-200"
  [class.cursor-pointer]="!!routerLink"
  [class.hover:bg-gray-50]="!!routerLink"
  (click)="openFavorite()"
  *ngIf="favorite">
  <div class="card-body">
    <div class="flex items-start justify-between space-x-4">
      <div class="flex items-start space-x-3">
        <div class="flex-shrink-0 p-2 bg-primary-100 rounded-lg">
          <span class="material-icons text-primary-600 text-xl" *ngIf="icon.icon" [attr.data-font]="icon.iconFont">{{ icon.icon }}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-gray-900 truncate">{{ name }}</div>
          <div class="text-xs text-gray-500 mt-1">{{ favoriteType }}</div>
        </div>
      </div>
      <div class="flex items-center space-x-2 flex-shrink-0">
        <span class="material-icons text-warning-500 text-sm" title="The entity for this favorite may have been deleted" *ngIf="!valid">warning</span>
        <app-entity-favorite-star [favorite]="favorite" [confirmRemoval]="true"></app-entity-favorite-star>
      </div>
    </div>
  </div>
</div>
