@if (data$ | async; as info) {
  <div class="flex flex-col">
    <div class="flex items-center">
      @if (info.warning) {
        <app-custom-icon class="flex items-center justify-center mr-2 text-warning">warning</app-custom-icon>
      }
      {{ info.ok }}
      @if (info.total > 0) {
        / {{info.total}}
      }
      @if (info.plural) {
        sources
      }
      @if (!info.plural) {
        source
      }
    </div>
  </div>
}
