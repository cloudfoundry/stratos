@if (data$ | async; as info) {
  <div class="metrics-details">
    <div class="metrics-details__line">
      @if (info.warning) {
        <app-custom-icon class="metrics-details__icon text-warning">warning</app-custom-icon>
      }
      {{ info.ok }}
      @if (info.total > 0) {
        / {{info.total}}
      }
      @if (info.plural) {
        sources
      }
      @if (!info.plural) {
        source
      }
    </div>
  </div>
}
