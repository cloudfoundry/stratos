<app-page-header>
  <h1>API Keys</h1>
</app-page-header>

@if (banners().length) {
  <ul class="m-0 mb-4 flex list-none flex-col gap-2 p-0">
    @for (b of banners(); track b.guid) {
      <li data-testid="key-banner" role="status"
        class="flex flex-wrap items-center justify-between gap-3 rounded border px-4 py-3"
        [class]="b.expired
          ? 'border-danger bg-danger-50 text-danger-900 dark:bg-danger-900/40 dark:text-danger-100'
          : 'border-warning bg-warning-50 text-content-text dark:bg-warning-900/40'">
        <span>{{ b.text }}</span>
        <button class="btn btn-secondary" type="button" (click)="createReplacement(b.comment)">Create replacement</button>
      </li>
    }
  </ul>
}

<app-list-sub-nav title="Total API Keys" [count]="keyCount" [loading]="loading" [addAction]="createAction"></app-list-sub-nav>

@if (hasKeys() === true) {
  <app-signal-list [config]="listConfig"></app-signal-list>
}
@if (hasKeys() === false) {
  <app-no-content-message icon="vpn_key" [firstLine]="'You have no API keys'"></app-no-content-message>
}
