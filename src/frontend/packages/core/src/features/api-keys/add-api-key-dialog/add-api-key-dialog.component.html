<div class="key-dialog__loading-wrapper">
  <app-progress-bar class="key-dialog__loading"
    [color]="hasErrored() && !isBusy() ? 'warn' : 'primary'"
    [mode]="isBusy() ? 'indeterminate' : 'solid'">
  </app-progress-bar>
</div>
<div class="key-dialog">
  <div class="key-dialog__title">
    <h2 class="text-xl font-semibold mb-4">
      Create an API Key
    </h2>
  </div>
  <div>
  </div>
  <div [formGroup]="formGroup">
    <app-form-field>
      <input class="w-full placeholder:!text-transparent focus:outline-none" appInput placeholder="Description" formControlName="comment" required>
    </app-form-field>
  </div>

  <app-dialog-error [message]="hasErrored()" [show]="hasErrored() && !isBusy()">
  </app-dialog-error>
  <div class="key-dialog__actions flex justify-end gap-2 mt-4">
    <button (click)="dialogRef.close()" class="btn btn-danger" type="button" [disabled]="isBusy()">Cancel</button>
    <button (click)="submit()" [disabled]="isBusy() || !formGroup.valid" class="btn btn-primary"
      type="button">Create</button>
  </div>
</div>
