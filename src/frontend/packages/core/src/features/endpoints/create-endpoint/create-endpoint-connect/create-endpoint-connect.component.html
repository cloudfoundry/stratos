<div class="connect">
  <div class="connect__option">
    <p class="connect__successful-reg-text text-[var(--content-text)]">
      <b>{{ connectService?.config.name }}</b> has been successfully registered.
    </p>
    <app-checkbox class="connect__checkbox" [(ngModel)]="doConnect">Connect to
      <b>{{ connectService?.config.name }}</b> now
      (optional).
    </app-checkbox>
    <div class="connect__subtext text-[var(--content-muted)]">You may connect this endpoint at a later date from the
      endpoints page.
    </div>
  </div>
  @if (doConnect) {
  <div>
    <!-- The gap and shrink-0 keep the help button off the title's end -->
    <div class="connect__title gap-2">
      <span class="connect__title-inner min-w-0 text-[var(--content-text)]">{{ credentialsTitle() }}</span>
      @if (helpDocumentUrl()) {
        <button [appBlur]="true" class="connect__title-help btn btn-icon shrink-0" type="button" aria-label="Help on connecting" (click)="showHelp()">
          <app-custom-icon>help</app-custom-icon>
        </button>
      }
    </div>
    <app-connect-endpoint class="stepper-form" (valid)="valid = $event"
      (authType)="authTypeChanged($event)" [connectService]="connectService">
    </app-connect-endpoint>
  </div>
  }
</div>
