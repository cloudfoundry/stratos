@if (!hideHeader) {
  <app-page-header>
    <h1>Register Endpoint</h1>
  </app-page-header>
}

@if (!component) {
  <app-steppers cancel="/endpoints">
    <app-step [title]="'Register'" [valid]="(step1.validate | async) ?? false" [onNext]="step1.onNext" [nextButtonText]="'Register'">
      <app-create-endpoint-cf-step-1 #step1 [finalStep]="!showConnectStep"></app-create-endpoint-cf-step-1>
    </app-step>
    @if (showConnectStep) {
      <app-step [title]="'Connect (Optional)'" [valid]="connect.doConnect ? connect.valid : true"
        [onNext]="connect.onNext" [onEnter]="connect.onEnter" [disablePrevious]="true" [hideCloseButton]="true"
        [finishButtonText]="connect.doConnect ? 'Connect' : 'Finish'">
        <app-create-endpoint-connect #connect></app-create-endpoint-connect>
      </app-step>
    }
  </app-steppers>
} @else {
}

<ng-template #customComponentContainer></ng-template>
