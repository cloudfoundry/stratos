<app-page-header>
  <h1>Endpoints</h1>
  <div class="page-header-right">
    <div class="flex items-center space-x-2">
      <!-- Register Endpoint moved to the L5 sub-nav above the endpoints
           list (see endpoints-signal-list template). Backup/Restore stays
           here because it's page-level admin, not a "create new endpoint"
           verb. -->
      @if (canBackupRestore$ | async) {
        <button id="stratos-restore-backup" class="btn btn-icon" type="button"
          [routerLink]="'/endpoints/backup-restore'" matTooltip="Backup/Restore Endpoints">
          <span class="material-icons">settings_backup_restore</span>
        </button>
      }
    </div>
  </div>
</app-page-header>

<!-- Show loading while initializing -->
@if ((isInitialised$ | async) === false) {
  <app-area-loader message="Loading endpoints..."></app-area-loader>
}

<!-- Show content once loaded -->
<div class="endpoints-content flex flex-col flex-1 min-h-0">
  @if (isInitialised$ | async) {
    @if ((endpointsService.haveRegistered$ | async)) {
      <app-endpoints-signal-list [addAction]="registerEndpointAction" class="flex-1"></app-endpoints-signal-list>
    } @else {
      <!-- The list (and its sub-nav) renders only with endpoints, so the
           first endpoint needs this sub-nav for its Register button. -->
      <app-list-sub-nav title="Total Endpoints" [count]="noEndpoints" [addAction]="registerEndpointAction"></app-list-sub-nav>
      @if (customizations.noEndpointsComponent) {
        <ng-container *ngComponentOutlet="customizations.noEndpointsComponent"></ng-container>
      } @else {
        <app-endpoints-missing [showToolbarHint]="false"
        [showDirectToEndpointMessage]="false"></app-endpoints-missing>
      }
    }
  }
</div>

<!-- Register Endpoint Modal -->
@if (showRegisterModal()) {
  <app-endpoint-register-modal
    (closeModalEvent)="closeRegisterModal()"
    (endpointRegistered)="onEndpointRegistered()"
  ></app-endpoint-register-modal>
}
