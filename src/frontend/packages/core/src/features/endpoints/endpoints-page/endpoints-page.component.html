<app-page-header>
  <h1>Endpoints</h1>
  <div class="page-header-right">
    <div class="flex items-center space-x-2">
      <button 
        id="stratos-add-endpoint" 
        *appUserPermission="canRegisterEndpoint | async" 
        mat-icon-button
        (click)="openRegisterModal()"
        matTooltip="Register Endpoint"
        class="bg-primary text-white hover:bg-opacity-90 transition-all duration-200 hover:scale-105"
      >
        <mat-icon>add</mat-icon>
      </button>
      <button id="stratos-restore-backup" *ngIf="canBackupRestore$ | async" mat-icon-button
        [routerLink]="'/endpoints/backup-restore'" matTooltip="Backup/Restore Endpoints">
        <mat-icon>settings_backup_restore</mat-icon>
      </button>
    </div>
  </div>
</app-page-header>

<!-- Debug: Always show this text to verify the template is working -->
<div style="margin: 20px; padding: 20px; background: #f0f0f0; border: 1px solid #ccc;">
  <h3>Debug Info:</h3>
  <p>Have registered: {{ (endpointsService.haveRegistered$ | async) }}</p>
  <p>Should show list: {{ (endpointsService.haveRegistered$ | async) ? 'YES' : 'NO' }}</p>
</div>

<app-list *ngIf="(endpointsService.haveRegistered$ | async); else noEndpointsContainer"></app-list>
<ng-template #noEndpointsContainer>
  <app-endpoints-missing *ngIf="!customizations.noEndpointsComponent; else customNoEndpoints"
    [showDirectToEndpointMessage]="false"></app-endpoints-missing>
</ng-template>
<ng-template #customNoEndpoints></ng-template>

<!-- Register Endpoint Modal -->
<app-endpoint-register-modal 
  *ngIf="showRegisterModal"
  (closeModalEvent)="closeRegisterModal()"
  (endpointRegistered)="onEndpointRegistered()"
></app-endpoint-register-modal>
