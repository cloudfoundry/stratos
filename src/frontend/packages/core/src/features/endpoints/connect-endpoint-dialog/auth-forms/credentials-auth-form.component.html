<div [formGroup]="formGroup">
  <div formGroupName="authValues" class="flex flex-col">
    <app-form-field>
      <input class="w-full placeholder:!text-transparent focus:outline-none" appInput placeholder="{{config?.usernameLabel}}" formControlName="username" required autocomplete="username">
    </app-form-field>
    <app-form-field>
      <input class="w-full placeholder:!text-transparent focus:outline-none" appInput placeholder="{{config?.passwordLabel}}" formControlName="password" name="password" required
        [type]="!showPassword ? 'password' : 'text'" autocomplete="current-password">
      <span matSuffix>
        <app-show-hide-button (changed)="showPassword = $event"></app-show-hide-button>
      </span>
    </app-form-field>
  </div>
</div>
