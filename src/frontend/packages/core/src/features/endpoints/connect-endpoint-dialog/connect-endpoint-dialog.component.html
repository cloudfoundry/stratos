<div class="connection-dialog">
  <div class="connection-dialog__title" data-dialog-drag-handle>
    <h2 [id]="titleId" class="flex-1 m-0 text-lg font-semibold text-content-text">
      Connect to {{ data.name }}
    </h2>
  </div>
  <!-- Static steps: the stepper reads its steps once. -->
  <app-steppers #steppers [startIndex]="1" [startData]="data" [cancelAction]="close">
    <app-step [title]="'Register'" [signalHandle]="registerStepHandle">
      <app-create-endpoint-cf-step-1 [reviewEndpoint]="endpoint()" (unregistered)="onUnregistered()"></app-create-endpoint-cf-step-1>
    </app-step>
    <app-step [title]="'Connect'" [signalHandle]="connectStepHandle">
      <app-create-endpoint-connect [fromConnect]="true" [stillConnected]="stillConnected()"
        [endpointAddress]="address()" [caCert]="caCert()" (review)="steppers.goTo(0)"></app-create-endpoint-connect>
    </app-step>
  </app-steppers>
</div>
