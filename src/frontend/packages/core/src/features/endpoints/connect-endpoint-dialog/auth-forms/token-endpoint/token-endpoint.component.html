<div [formGroup]="formGroup" class="token">
  @if (config.helpText) {
    <div class="token__help-text">
      <p>{{ config.helpText }}</p>
    </div>
  }
  <div formGroupName="authValues" class="token__form">
    <app-form-field>
      <input class="w-full placeholder:!text-transparent" appInput placeholder="{{config.title || 'Token'}}" type="password" formControlName="token"
        [type]="!showToken ? 'password' : 'text'" autocomplete="off">
      <button class="btn btn-icon" matSuffix (click)="showToken = !showToken" [attr.aria-label]="'Hide Token'"
        [attr.aria-pressed]="!showToken" type="button">
        <app-custom-icon>{{!showToken ? 'visibility_off' : 'visibility'}}</app-custom-icon>
      </button>
    </app-form-field>
  </div>
</div>
