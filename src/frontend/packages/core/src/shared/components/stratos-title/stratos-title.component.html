<div class="stratos-title text-center">
  <img class="stratos-title__logo mx-auto mb-4" [src]="themeLogo()" />
  <h1 class="stratos-title__header text-2xl font-bold text-content-text mb-2">
    {{ title || themeTitle() }}
  </h1>
  @if (themeSubtitle()) {
    <p class="stratos-title__subtitle text-content-muted text-sm">
      {{ themeSubtitle() }}
    </p>
  }
</div>
