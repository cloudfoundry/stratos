<div class="paginator flex items-center justify-between p-4">
  <div class="paginator-page-size flex items-center gap-2">
    <label for="pageSize" class="text-sm text-gray-600">Items per page:</label>
    <select
      id="pageSize"
      class="select select-sm"
      [value]="pageSize"
      (change)="changePageSize(+$any($event.target).value)">
      @for (option of pageSizeOptions; track option) {
        <option [value]="option">
          {{option}}
        </option>
      }
    </select>
  </div>

  <div class="paginator-info text-sm text-gray-600">
    @if (length > 0) {
      <span>{{getStartIndex()}} - {{getEndIndex()}} of {{length}}</span>
    }
    @if (length === 0) {
      <span>0 of 0</span>
    }
  </div>

  <div class="paginator-controls flex items-center gap-1">
    @if (showFirstLastButtons) {
      <button
        class="btn btn-sm btn-icon"
        [disabled]="!hasPreviousPage"
        (click)="firstPage()"
        title="First page">
        <span class="material-icons">first_page</span>
      </button>
    }
    <button
      class="btn btn-sm btn-icon"
      [disabled]="!hasPreviousPage"
      (click)="previousPage()"
      title="Previous page">
      <span class="material-icons">chevron_left</span>
    </button>
    <button
      class="btn btn-sm btn-icon"
      [disabled]="!hasNextPage"
      (click)="nextPage()"
      title="Next page">
      <span class="material-icons">chevron_right</span>
    </button>
    @if (showFirstLastButtons) {
      <button
        class="btn btn-sm btn-icon"
        [disabled]="!hasNextPage"
        (click)="lastPage()"
        title="Last page">
        <span class="material-icons">last_page</span>
      </button>
    }
  </div>
</div>
