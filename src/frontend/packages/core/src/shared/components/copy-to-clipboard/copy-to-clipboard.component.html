<!-- One button in every state: only its icon changes, so a press keeps
     focus on it. A button taken out of the page drops focus to the page
     body (WCAG 2.4.3). The "Copied to clipboard" text shows beside it. -->
<div class="inline-flex items-center gap-1">
  <!-- Tells a screen reader how the copy went; present from the start so
       the change is announced. -->
  <span class="sr-only" aria-live="polite">{{ didUserPressCopy() === 'yes and succeeded' ? 'Copied to clipboard' : didUserPressCopy() === 'yes but failed' ? 'Copy failed' : '' }}</span>
  @if (didUserPressCopy() === 'yes and succeeded' && showSuccessText()) {
    <span class="text-sm text-success-shade-600 whitespace-nowrap">Copied to clipboard</span>
  }
  <button
      class="inline-flex"
      appClickStopPropagation
      [class.animate-scale-pop-in]="didUserPressCopy() === 'yes and saw succeeded'"
      [attr.aria-label]="tooltip() || 'Copy to clipboard'"
      [title]="tooltip()"
      (click)="copyToClipboard(text())">
    @switch (didUserPressCopy()) {
      @case ('yes and succeeded') {
        <span aria-hidden="true"
          class="material-icons text-success-shade-600 animate-scale-pop-in"
          [ngClass]="{'text-sm': compact(), 'text-base': !compact()}">
          check_circle
        </span>
      }
      @case ('yes but failed') {
        <span aria-hidden="true" class="material-icons text-status-danger"
          [title]="'Failed to copy text. This might be due to security settings surrounding the clipboard API.'"
          [ngClass]="{'text-sm': compact(), 'text-base': !compact()}">
          error
        </span>
      }
      @default {
        <span
          [ngClass]="{'text-sm': compact(), 'text-base': !compact()}"
          aria-hidden="true"
          class="material-icons cursor-pointer text-content-muted hover:text-content-text transition-opacity duration-300">
          content_copy
        </span>
      }
    }
  </button>
</div>
