<div class="copy relative inline-flex items-center gap-2"
  [ngClass]="{'copy__success': copySuccessWait}">
  <div class="copy__copied-div flex items-center gap-1"
    [class.opacity-100]="copySuccessWait"
    [class.opacity-0]="!copySuccessWait"
    class="transition-opacity duration-300">
    @if (showSuccessText) {
      <span class="copy__copied-msg text-sm text-success-shade-600">Copied to clipboard</span>
    }
    <span class="material-icons copy__copied-icon text-success-shade-600"
      [ngClass]="{'text-sm': compact, 'text-base': !compact}">
      check_circle
    </span>
  </div>
  @if (canCopy) {
    <span class="material-icons copy__copy-icon cursor-pointer text-content-muted hover:text-content-text transition-colors"
      [ngClass]="{'text-sm': compact, 'text-base': !compact}"
      role="button" tabindex="0"
      (click)="copyToClipboard($event)"
      (keydown.enter)="copyToClipboard($event)"
      (keydown.space)="copyToClipboard($event); $event.preventDefault()"
      [title]="tooltip">
      content_copy
    </span>
  }
</div>
