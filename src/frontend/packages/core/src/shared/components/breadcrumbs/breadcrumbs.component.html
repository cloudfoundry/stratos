@if (breadcrumbs?.length) {
  <div class="breadcrumbs flex items-center text-2xl font-semibold leading-8">
    @for (crumb of breadcrumbs; track $index) {
      @if (crumb.routerLink) {
        <a class="breadcrumb opacity-70 hover:opacity-100 transition-opacity cursor-pointer no-underline"
        [routerLink]="crumb.routerLink">{{ crumb.value }}</a>
      } @else {
        <span class="breadcrumb opacity-70">{{ crumb.value }}</span>
      }
      <span class="material-icons opacity-70 shrink-0 mx-[3px] text-[26px] select-none">chevron_right</span>
    }
  </div>
}
