@if (breadcrumbDefinitions) {
  <div class="breadcrumb__list">
    @for (breadcrumbDef of breadcrumbDefinitions; track breadcrumbDef) {
      @if (breadcrumbDef.routerLink) {
        <span class="breadcrumb breadcrumb__link"
        [routerLink]="breadcrumbDef.routerLink">{{ breadcrumbDef.value }}</span>
      }
      @if (!breadcrumbDef.routerLink) {
        <span class="breadcrumb">{{ breadcrumbDef.value }}</span>
      }
      <app-custom-icon class="breadcrumb__separator">chevron_right</app-custom-icon>
    }
  </div>
}
