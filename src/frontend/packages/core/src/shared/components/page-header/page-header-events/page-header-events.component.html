@if (errorMessage$ | async; as message) {
  <div class="px-4 py-2">
    <div class="inline-flex items-start gap-2 px-3 py-1.5 max-w-full rounded-md bg-[var(--danger-bg)] border border-[var(--danger-border)] text-[var(--danger-text)]">
      <app-custom-icon class="shrink-0 self-center">error</app-custom-icon>
      @if (singleErrorEvent$ | async; as ev) {
        <div class="flex flex-col min-w-0 max-w-prose">
          <h3 class="text-sm font-bold truncate m-0" [title]="ev.endpointName + ' (' + ev.endpointId + ')'">
            {{ ev.endpointName }} <span class="font-normal text-xs">({{ ev.endpointId }})</span>
          </h3>
          <span class="text-xs whitespace-normal break-words mt-1 text-balance">{{ ev.detail }}</span>
        </div>
      } @else {
        <span class="text-sm whitespace-normal break-words self-center max-w-prose text-balance">{{ message }}</span>
      }
      @if (!endpointId) {
        <a class="underline hover:no-underline font-medium text-sm shrink-0 self-center" [routerLink]="['/events/endpoints']">view details</a>
      }
      @if (endpointId) {
        <a class="underline hover:no-underline font-medium text-sm shrink-0 self-center" [routerLink]="['/errors/', endpointId]">view details</a>
      }
      <button type="button" class="cursor-pointer hover:opacity-70 shrink-0 self-center flex"
        aria-label="Dismiss" (click)="markEventsAsRead()">
        <app-custom-icon>clear</app-custom-icon>
      </button>
    </div>
  </div>
}
