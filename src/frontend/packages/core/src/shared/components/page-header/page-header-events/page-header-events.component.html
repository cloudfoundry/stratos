@if (errorMessage$ | async; as message) {
  <div class="px-4 py-2">
    <div class="inline-flex items-start gap-2 px-3 py-1.5 max-w-full rounded-md bg-danger-shade-50 border border-danger-shade-200 text-danger-shade-700">
      <app-custom-icon class="text-danger-shade-500 shrink-0 self-center">error</app-custom-icon>
      @if (singleErrorEvent$ | async; as ev) {
        <div class="flex flex-col min-w-0 max-w-prose">
          <h3 class="text-sm font-bold truncate m-0" [title]="ev.endpointName + ' (' + ev.endpointId + ')'">
            {{ ev.endpointName }} <span class="font-normal text-xs text-danger-shade-500">({{ ev.endpointId }})</span>
          </h3>
          <span class="text-xs whitespace-normal break-words mt-1" style="text-wrap: balance">{{ ev.detail }}</span>
        </div>
      } @else {
        <span class="text-sm whitespace-normal break-words self-center max-w-prose" style="text-wrap: balance">{{ message }}</span>
      }
      @if (!endpointId) {
        <a class="text-primary hover:underline font-medium text-sm shrink-0 self-center" [routerLink]="['/events/endpoints']">view details</a>
      }
      @if (endpointId) {
        <a class="text-primary hover:underline font-medium text-sm shrink-0 self-center" [routerLink]="['/errors/', endpointId]">view details</a>
      }
      <app-custom-icon class="cursor-pointer text-danger-shade-500 hover:text-danger-shade-800 shrink-0 self-center"
        (click)="markEventsAsRead()">clear</app-custom-icon>
    </div>
  </div>
}
