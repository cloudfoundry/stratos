@if (errorMessage$ | async; as message) {
  <div class="header-event--error">
    <div class="header-event__outer">
      <span class="header-event">
        <span class="header-event__error-message">
          <app-custom-icon class="header-event__error-icon">error</app-custom-icon>
          <div class="header-event__message-wrapper">{{ message }} -
            @if (!endpointId) {
              <span>
                <a class="header-event__details-link" [routerLink]="['/events/endpoints']">view details</a>
              </span>
            }
            @if (endpointId) {
              <span>
                <a class="header-event__details-link" [routerLink]="['/errors/', endpointId]">view details</a>
              </span>
            }
          </div>
        </span>
        <!-- *ngIf="endpointId"  -->
        <app-custom-icon class="header-event__error-dismiss" (click)="markEventsAsRead()">
          clear
        </app-custom-icon>
      </span>
    </div>
  </div>
}
