@if (endpoint$ | async; as endpoint) {
  <div class="endpoint-name-cell">
    @if (endpoint.canShowLink) {
      <a routerLink="{{ endpoint.link }}">{{ endpoint.name }}</a>
    }
    @if (!endpoint.canShowLink) {
      <span>{{ endpoint.name }}</span>
    }
    @if (!!endpoint.system_shared_token) {
      <app-custom-icon
        matTooltip="This endpoint's connection is shared by the administrator" class="endpoint-name-cell__icon">share
      </app-custom-icon>
    }
  </div>
}
