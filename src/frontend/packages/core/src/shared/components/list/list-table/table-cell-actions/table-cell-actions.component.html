@if ((show$ | async)) {
  <div class="relative inline-block">
    <button [disabled]="busy$ | async" class="btn btn-icon" (click)="toggleMenu()">
      <span class="material-icons">more_vert</span>
    </button>
    <div class="dropdown-menu absolute right-0 top-full mt-1 min-w-48 bg-white border border-gray-200 rounded-md shadow-lg z-50"
      [class.hidden]="!menuOpen">
      @for (action of actions; track action) {
        @if (obs.visible[action.label] | async) {
          <button class="table-cell-actions__button dropdown-item flex items-center gap-2 w-full px-4 py-2 text-left text-sm hover:bg-gray-100"
            (click)="action.action(row); toggleMenu()"
            [disabled]="!(obs.enabled[action.label] | async)"
            [title]="action.description"
            [ngClass]="{'hasIcon': !!action.icon}">
            @if (!!action.icon) {
              <span class="material-icons text-sm">{{action.icon}}</span>
            }
            <span>{{action.label}}</span>
          </button>
        }
      }
    </div>
  </div>
}
