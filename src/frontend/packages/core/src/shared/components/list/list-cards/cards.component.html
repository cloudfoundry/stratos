@if (component) {
  <div class="cards {{'cards__columns-' + columns}}">
    @for (item of dataSource.page$ | async; track multiActionTrackBy()($index, item)) {
      <app-card [item]="item" [component]="component" [dataSource]="dataSource">
      </app-card>
    }
    <app-card class="row-filler"></app-card>
  </div>
}
