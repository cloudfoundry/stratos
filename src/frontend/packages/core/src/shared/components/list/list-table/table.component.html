<div class="app-table">
  <div class="app-table__loading" *ngIf="dataSource.isTableLoading$">
    <div *ngIf="dataSource.isTableLoading$ | async" class="progress-bar">
      <div class="progress-bar-indeterminate bg-primary-500"></div>
    </div>
  </div>
  <div class="card app-table__card"
    [ngClass]="{'in-expanded-row': !!inExpandedRow, 'has-expanded-row': expandComponent}">
    <div class="card-content app-table__content">
      <div class="table-container app-table__inner" #table [hidden]="hideTable">
        <table class="table w-full">
          <thead>
            <tr class="app-table__header-row"
              [ngClass]="{'in-expanded-row': !!inExpandedRow, 'has-expanded-row': expandComponent, 'app-table__inner--has-expanded-columns': !!expandComponent}"
              [hidden]="hideTable">
              <th *ngFor="let column of columns"
                class="app-table__header-cell table-cell-header"
                [ngClass]="[column.class || '', column.headerClass || '']"
                [style.flex]="column.cellFlex">
                <div class="flex items-center gap-1"
                  [class.cursor-pointer]="column.sort"
                  (click)="column.sort && handleSort(column)">
                  <app-table-cell [component]="column.headerCellComponent" [func]="column.headerCell"
                    [dataSource]="dataSource"></app-table-cell>
                  <span *ngIf="column.sort" class="material-icons text-sm text-gray-400">sort</span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <app-table-row class="app-table__row" *ngFor="let row of dataSource.connect(null) | async; let i = index; trackBy: dataSource.trackBy"
              [columns]="columns"
              [dataSource]="dataSource"
              [rowState]="getRowState(row)"
              [row]="row" [expandComponent]="expandComponent" [inExpandedRow]="inExpandedRow" [minRowHeight]="minRowHeight"
              [rowId]="dataSource.trackBy(i, row)" [prominentErrorBar]="prominentErrorBar">
            </app-table-row>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
