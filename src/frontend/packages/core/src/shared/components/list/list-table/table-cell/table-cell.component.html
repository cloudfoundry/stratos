<!-- Ensure any key presses are retained within this element. This stops parent expansion panel from consuming space
key (see edit env var) -->
<div tabindex="-1" (keydown)="$event.stopPropagation()">
  <div #target>
    @if (func && !component && !cellDefinition) {
      <div>
        {{func(row)}}
      </div>
    }
  </div>
</div>
