@if (endpointAddress$ | async; as address) {
  <div class="endpoint-address-cell">
    <div>{{ address }}</div>
    <app-copy-to-clipboard class="endpoint-address-cell__copy" [compact]="true" [text]="address" tooltip="Copy to clipboard" [showSuccessText]="false">
    </app-copy-to-clipboard>
  </div>
}
