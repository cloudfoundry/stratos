<div class="flex gap-1 justify-end">
  @if (!isEditing()) {
    <button class="btn btn-icon btn-sm" [ngClass]="subtle ? 'text-[18px] h-[25px] leading-[25px] opacity-60 pl-[5px] w-[35px]' : ''" (click)="dataSource.startEdit(row)"
      [disabled]="(dataSource.isSelecting$ | async) || (dataSource.isAdding$ | async)">
      <span class="material-icons">edit</span>
    </button>
  } @else {
    <button id="table-cell-edit-done" class="btn btn-icon btn-sm btn-success" [ngClass]="subtle ? 'text-[18px] h-[25px] leading-[25px] opacity-60 pl-[5px] w-[35px]' : ''" (click)="dataSource.saveEdit()">
      <span class="material-icons">done</span>
    </button>
    <button id="table-cell-edit-cancel" class="btn btn-icon btn-sm" [ngClass]="subtle ? 'text-[18px] h-[25px] leading-[25px] opacity-60 pl-[5px] w-[35px]' : ''" (click)="dataSource.cancelEdit()">
      <span class="material-icons">clear</span>
    </button>
  }
</div>
