<div>
  <ng-container *ngIf="connectable; else notConnectable">
    <ng-container *ngIf="row.connectionStatus === 'connected' ">
      <span *ngIf="config?.showLabel">Connected <span *ngIf="row.local">(local)</span></span>
      <app-custom-icon fontSet="stratos-icons">endpoints_connected</app-custom-icon>
    </ng-container>
    <ng-container *ngIf="row.connectionStatus === 'disconnected'">
      <span *ngIf="config?.showLabel">Disconnected <span *ngIf="row.local">(local)</span></span>
      <app-custom-icon fontSet="stratos-icons">endpoints_disconnected</app-custom-icon>
    </ng-container>
    <ng-container *ngIf="row.connectionStatus === 'checking'">
      <span *ngIf="config?.showLabel">Updating </span>
      <app-spinner [diameter]="20"></app-spinner>
    </ng-container>
    <ng-container *ngIf="!row.connectionStatus || row.connectionStatus === 'unknown'">
      <span *ngIf="config?.showLabel">Unknown </span>
      <app-custom-icon>help_outline</app-custom-icon>
    </ng-container>
  </ng-container>
  <ng-template #notConnectable>
    <ng-container *ngIf="row?.endpoint_metadata?.status as status; else noStatus">
      <ng-container *ngIf="status === 'Synchronized'">
        <span *ngIf="config?.showLabel">Synchronized </span>
        <app-custom-icon>cloud_done</app-custom-icon>
      </ng-container>
      <ng-container *ngIf="status === 'Synchronizing'">
        <span *ngIf="config?.showLabel">Synchronizing </span>
        <app-spinner [diameter]="20"></app-spinner>
      </ng-container>
      <ng-container *ngIf="status === 'Pending'">
        <span *ngIf="config?.showLabel">Sync Pending</span>
        <app-custom-icon>hourglass_empty</app-custom-icon>
      </ng-container>
      <ng-container *ngIf="status === 'Failed'">
        <span *ngIf="config?.showLabel">Synchronization failed</span>
        <app-custom-icon>sync_problem</app-custom-icon>
      </ng-container>
    </ng-container>
    <ng-template #noStatus>
      -
    </ng-template>
  </ng-template>
</div>
