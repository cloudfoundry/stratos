<div class="expander cursor-pointer inline-flex items-center justify-center w-6 h-6"
     (click)="toggle()"
     [@indicatorRotate]="expandedService.expanded[rowId] ? 'expanded': 'collapsed'">
  <div class="expander__icon-container">
    <span class="material-icons text-sm transition-transform duration-200"
          [class.rotate-90]="expandedService.expanded[rowId]">
      chevron_right
    </span>
  </div>
</div>
