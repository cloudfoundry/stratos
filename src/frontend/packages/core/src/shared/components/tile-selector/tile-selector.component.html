<div class="tile-selectors">
  <ng-container *ngTemplateOutlet="tile; context:{ options: options, selected: selected }"></ng-container>
  @if (showingMore && hiddenOptions.length > 0) {
    <ng-container *ngTemplateOutlet="tile; context:{ options: hiddenOptions, selected: selected }"></ng-container>
  }
  @if (hiddenOptions.length > 0) {
    <div role="button" tabindex="0"
      (click)="toggleMore()"
      (keydown.enter)="toggleMore()"
      (keydown.space)="toggleMore(); $event.preventDefault()"
      class="tile-selector__more">
      {{ showingMore ? 'Show less' : 'Show more' }}
    </div>
  }
</div>

<ng-template #tile let-options="options" let-selected="selected">
  @for (tile of options; track tile) {
    <app-tile-selector-tile (tileSelect)="selectionChange(tile)" [tile]="tile"
      [active]="selected === tile || !selected" [smaller]="smallerTiles" [compact]="compactTiles">
    </app-tile-selector-tile>
  }
</ng-template>
