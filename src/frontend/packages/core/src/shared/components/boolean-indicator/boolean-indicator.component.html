@if (booleanOutput(); as booleanOutput) {
  <div class="boolean-indicator flex items-center justify-end">
    <div class="boolean-indicator-container flex items-center" [ngClass]="{'space-x-2': showText()}">
      <!-- With its text beside it the icon is decoration; alone, it is the answer. -->
      <span
        class="material-icons text-lg"
        [attr.aria-hidden]="showText() ? 'true' : null"
        [attr.role]="showText() ? null : 'img'"
        [attr.aria-label]="showText() ? null : booleanOutput.text"
      [ngClass]="{
        'text-content-muted': booleanOutput.subtle,
        'text-success-shade-500': booleanOutput.isTrue && !booleanOutput.subtle,
        'text-danger-shade-500': !booleanOutput.isTrue && !booleanOutput.subtle
      }">
        {{ booleanOutput.icon }}
      </span>
      @if (showText()) {
        <span class="text-sm text-content-muted">
          {{ booleanOutput.text }}
        </span>
      }
    </div>
  </div>
}
