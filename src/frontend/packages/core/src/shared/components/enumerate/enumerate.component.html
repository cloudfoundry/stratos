@let path = labelPath();
@if ((collection() | async); as collection) {
  <div>
    @if (collection.length > 0) {
      <div>
        @for (item of collection; track $index; let index = $index) {
          <span>
            {{path ? item[path] : item}}@if (index !== collection.length - 1) {
            <span>, </span>
          }
        </span>
      }
    </div>
  } @else {
    <div>None</div>
  }
</div>
} @else {
  <div>None</div>
}
