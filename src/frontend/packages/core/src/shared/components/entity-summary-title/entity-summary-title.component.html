<div class="entity-summary">
  <div class="entity-summary__header-section">
    <!-- <img *ngIf="imagePath" class="entity-summary__logo" title="{{ title }}'s image" src="{{ imagePath }}"> -->
    @if (image) {
      <img class="entity-summary__img" title="{{ title }}'s image" [src]="image"
        (error)="failedImageLoad()" alt="{{ title }}">
    } @else {
      <app-custom-icon class="entity-summary__logo" fontSet="{{fallBackIconFont}}">{{fallBackIcon}}</app-custom-icon>
    }

    <div class="entity-summary__header-inner">
      <div class="entity-summary__header-wrapper">
        <h1 class="entity-summary__header">{{ title }} </h1>
        @if (info) {
          <app-custom-icon class="entity-summary__header-info" matTooltip="{{ info }}">
          info</app-custom-icon>
        }
      </div>
      @if (subTitle) {
        <div class="entity-summary__sub-header"> {{ subTitle }}</div>
      }
      @if (subText) {
        <div class="entity-summary__sub-text"> {{ subText }}</div>
      }
    </div>
  </div>
  <div class="entity-summary__content">
    <ng-content></ng-content>
  </div>
</div>
