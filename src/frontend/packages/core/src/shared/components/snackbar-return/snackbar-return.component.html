<div class="app-snackbar-return mat-simple-snackbar">
  <span>{{ message }}</span>
  @if (returnUrl) {
    <div class="app-snackbar-return-action mat-simple-snackbar-action">
      <button class="btn btn-ghost" type="button" (click)="return()">{{ returnLabel }}</button>
      <button class="btn btn-ghost" type="button" (click)="dismiss()">Dismiss</button>
    </div>
  }
</div>
