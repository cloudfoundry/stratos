<div class="app-state" [ngClass]="{'app-state__with-icon': !hideIcon}">
  @if (!hideIcon) {
    <app-application-state-icon [status]="status$ | async "></app-application-state-icon>
  }
  <span class="app-state__label">{{ label$ | async }}</span>
  @if (!initialStateOnly && (subLabel$ | async); as subLabel) {
    <span>
      <span>&nbsp;-&nbsp;</span>
      <span class="app-state__sub-label">{{ subLabel$ | async }}</span>
    </span>
  }
</div>
