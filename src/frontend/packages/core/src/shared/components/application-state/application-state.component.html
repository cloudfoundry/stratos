<div class="flex flex-row items-center" [class.h-\[25px\]]="!hideIcon()">
  @if (!hideIcon()) {
    <!-- The label beside it says the state; the icon's own name would be read twice. -->
    <app-application-state-icon class="pr-[5px]" aria-hidden="true" [status]="status$ | async "></app-application-state-icon>
  }
  <span class="overflow-hidden text-ellipsis">{{ label$ | async }}</span>
  @if (!initialStateOnly() && (subLabel$ | async); as subLabel) {
    <span>
      <span>&nbsp;-&nbsp;</span>
      <span class="overflow-hidden text-ellipsis">{{ subLabel$ | async }}</span>
    </span>
  }
</div>
