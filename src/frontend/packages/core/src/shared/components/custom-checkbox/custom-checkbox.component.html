<div class="custom-checkbox-wrapper">
  <div class="custom-checkbox" role="checkbox"
    [attr.aria-checked]="indeterminate ? 'mixed' : checked"
    [attr.tabindex]="disabled ? -1 : 0"
    [class.disabled]="disabled"
    [class.checked]="checked"
    [class.indeterminate]="indeterminate"
    [class.invalid]="invalid"
    [class.color-primary]="color === 'primary'"
    [class.color-accent]="color === 'accent'"
    [class.color-warn]="color === 'warn'"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-describedby]="invalid && errorMessage ? 'error-' + (id || name) : null"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()">

    <div class="checkbox-container">
      <input type="checkbox"
        [id]="id"
        [name]="name"
        [checked]="checked"
        [disabled]="disabled"
        [required]="required"
        [value]="value"
        class="checkbox-input"
        (click)="$event.stopPropagation()">

      <div class="checkbox-frame">
        <svg class="checkbox-checkmark"
          [class.indeterminate]="indeterminate"
          viewBox="0 0 24 24"
          width="16"
          height="16">
          @if (!indeterminate) {
            <path
              class="checkmark-path"
              d="M9,16.17L4.83,12l-1.42,1.41L9,19L21,7l-1.41-1.41L9,16.17z"/>
          }
          @if (indeterminate) {
            <path
              class="indeterminate-path"
              d="M19,13H5V11H19V13Z"/>
          }
        </svg>
      </div>
    </div>

    <span class="checkbox-label" style="color: var(--content-text);">
      <ng-content></ng-content>
    </span>
  </div>

  @if (invalid && errorMessage) {
    <div class="checkbox-error">
      <div [id]="'error-' + (id || name)" role="alert" aria-live="polite">
        {{ errorMessage }}
      </div>
    </div>
  }
</div>
