<div class="flex items-center flex-wrap w-full">
  <div class="flex-none px-[5px]" role="group" aria-label="Start">
    <app-date-time [dateTime]="startValue" (dateTimeChange)="setStart($event)"></app-date-time>
  </div>
  <div class="px-[5px]">
    to
  </div>
  <div class="flex-none px-[5px]" role="group" aria-label="End">
    <app-date-time [dateTime]="endValue" (dateTimeChange)="setEnd($event)"></app-date-time>
  </div>
</div>
<div class="text-xs min-h-4">
  {{ validMessage }}
</div>
