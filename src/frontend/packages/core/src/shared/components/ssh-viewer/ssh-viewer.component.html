<div class="ssh-viewer">
  @if (!message() && (error() || !isConnected())) {
    <div class="ssh-viewer__overlay">
      @if (error()) {
        <div class="ssh-viewer__error">
          {{ error() }}
        </div>
      }
      @if (!error() && !isConnected() && !attemptingConnection()) {
        <div class="ssh-viewer__disconnected">
          Disconnected
        </div>
      }
    </div>
  }
  @if (message()) {
    <div class="ssh-viewer__overlay">
      <div class="ssh-viewer__disconnected">
        {{ message() }}
      </div>
    </div>
  }
  @if (attemptingConnection()) {
    <app-progress-bar mode="indeterminate"></app-progress-bar>
  }
  <div class="ssh-terminal" #container [ngClass]="{'ssh-terminal-disconnected': !isConnected()}">
    <div id="terminal" #terminal></div>
  </div>
</div>
