<form class="space-y-4">
  @for (f of fields(); track f.pointer) {
    <div class="form-group">
      <label [for]="f.pointer" class="block text-sm font-medium text-content-text mb-1">
        {{ f.title }}@if (f.required) { <span class="text-red-500">*</span> }
      </label>

      @switch (f.kind) {
        @case ('object') {
          <div class="pl-4 border-l border-content-border">
            <json-schema-form [schema]="f.schema" [data]="valueAt(f.pointer)"
              [_basePointer]="f.pointer"
              (changes)="onChild(f.pointer, $event)"></json-schema-form>
          </div>
        }
        @case ('enum') {
          <select [id]="f.pointer" [attr.data-path]="f.pointer"
            [value]="valueAt(f.pointer) ?? ''" (change)="setScalar(f, $event)"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md">
            <option value="">Select an option</option>
            @for (o of f.schema.enum; track o) { <option [value]="o">{{ o }}</option> }
          </select>
        }
        @case ('boolean') {
          <input type="checkbox" [attr.data-path]="f.pointer"
            [checked]="valueAt(f.pointer) === true" (change)="setBool(f, $event)"
            class="h-4 w-4 rounded border-gray-300" />
        }
        @default {
          <input [id]="f.pointer" [attr.data-path]="f.pointer" [type]="inputType(f)"
            [value]="valueAt(f.pointer) ?? ''" (input)="setScalar(f, $event)"
            [placeholder]="f.description ?? ''"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md" />
        }
      }
      @if (f.description && f.kind !== 'boolean') {
        <div class="mt-1 text-sm text-content-muted">{{ f.description }}</div>
      }
    </div>
  }
</form>
