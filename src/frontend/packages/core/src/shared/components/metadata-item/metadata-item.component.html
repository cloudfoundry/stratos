<div class="metadata-item">
  @if (icon && !tooltip) {
    <app-custom-icon class="metadata-item__icon" [fontSet]="iconFont" [ngClass]="{'metadata-item__icon_spacer': (icon === '-')}">{{ icon }}</app-custom-icon>
  }
  @if (icon && tooltip) {
    <app-custom-icon matTooltip="{{ tooltip }}" [fontSet]="iconFont" class="metadata-item__icon" [ngClass]="{'metadata-item__icon_spacer': (icon === '-')}">{{ icon }}</app-custom-icon>
  }
  <div class="metadata-item__content" [ngClass]="{'metadata-item__content-label-only': metadataValue.childNodes.length === 0}">
    @if (label) {
      <div [ngClass]="{'metadata-item__label-only': metadataValue.childNodes.length === 0}" class="metadata-item__label">
        <div [ngClass]="{'metadata-item__label-copy': clipboardValue}">{{ label }}</div>
        @if (clipboardValue) {
          <app-copy-to-clipboard [compact]="true" [text]="clipboardValue" tooltip="Copy to clipboard" [showSuccessText]="false">
          </app-copy-to-clipboard>
        }
      </div>
    }
    <div class="metadata-item__value">
      <div #metadataValue>
        <ng-content></ng-content>
      </div>
      @if (!edit) {
        <div>
          <ng-content select="[view]"></ng-content>
        </div>
      }
      @if (edit) {
        <div>
          <ng-content select="[edit]"></ng-content>
        </div>
      }
    </div>
  </div>
</div>
