<div class="relative rounded-md p-[10px_20px] bg-[var(--code-block-bg)] border border-[var(--code-block-border)] text-[var(--code-block-text)]"
  [class.px-\[20px\]]="codeBlockStyle === 'pre'">
  <div class="flex flex-col justify-center p-4 font-mono text-sm overflow-x-auto mr-[20px]" #preBlock>
    <ng-content></ng-content>
  </div>
  @if (!hideCopy) {
    <app-copy-to-clipboard
      class="absolute top-[10px] right-[20px]"
      [text]="text"
      [compact]="true">
    </app-copy-to-clipboard>
  }
</div>
