<div class="app-code-block relative bg-gray-100 border border-gray-200 rounded-md"
     [ngClass]="{ 'app-code-block__pre': codeBlockStyle === 'pre'}">
  <div class="app-code-block__content p-4 font-mono text-sm overflow-x-auto" #preBlock>
    <ng-content></ng-content>
  </div>
  <app-copy-to-clipboard *ngIf="!hideCopy"
                         class="app-code-block__copy absolute top-2 right-2"
                         [text]="text"
                         [compact]="true">
  </app-copy-to-clipboard>
</div>
