<div class="sidepanel-preview" [ngClass]="{'sidepanel-preview__preview': sidePanelService.previewMode()}">
  <div class="sidepanel-preview__header">
    <h1>{{ title }}</h1>
    @if (favorite) {
      <app-entity-favorite-star [small]="true" class="sidepanel-preview__favorite" [favorite]="favorite"></app-entity-favorite-star>
    }
    <div  class="sidepanel-preview__custom">
      @if (header) {
        <ng-container [cdkPortalOutlet]="header"></ng-container>
      }
    </div>
    <button class="sidepanel__close btn btn-icon" type="button" (click)="sidePanelService.hide()">
      <app-custom-icon>close</app-custom-icon>
    </button>
  </div>
  <div class="sidepanel-preview__content">
    <ng-content></ng-content>
  </div>
</div>
