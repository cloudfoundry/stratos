@if (!edit) {
  <div>
    @if (displayCustom.children.length === 0) {
      <app-display-value [label]="label" [value]="value"></app-display-value>
    }
    <div #displayCustom>
      <ng-content select=".display-input__display"></ng-content>
    </div>
  </div>
}
@if (edit) {
  <div>
    <ng-content select=".display-input__input"></ng-content>
  </div>
}
