<div class="custom-select" [class.disabled]="disabled" [class.open]="isOpen">
  <div class="select-trigger" #selectTrigger (click)="toggle()">
    <span class="select-value" [class.placeholder]="!displayValue">
      {{ displayValue || placeholder }}
    </span>
    <div class="select-arrow">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="select-options" *ngIf="isOpen">
    <div class="options-container">
      <ng-content></ng-content>
    </div>
  </div>
</div>
