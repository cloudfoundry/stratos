<div class="user-profile-banner">
  <div class="user-profile-banner__avatar">
    <app-user-avatar size="large" [allowGravatar]="canUseGravatar" fallback="initials" [user]="userProfile"></app-user-avatar>
  </div>
  @if ((name || email)) {
    <div class="user-profile-banner__title">
      <div>{{ name }}</div>
      <div class="user-profile-banner__email">{{ email }}</div>
    </div>
  } @else {
    <div class="user-profile-banner__title">
      <div>{{ username }}</div>
    </div>
  }
</div>
