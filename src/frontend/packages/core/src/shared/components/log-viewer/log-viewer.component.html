<div class="log-viewer">
  <!-- Focusable so the keyboard can scroll it (it holds no control).
       Not role="log": that is a live region and would read each line. -->
  <div class="log-scroller" #container tabindex="0" role="region" aria-label="Log">
    <div class="log-scroller__content" #content></div>
  </div>

  <div class="log-viewer__scrollToBotttom">
    @if (( isLocked$ | async ) === false) {
      <button (click)="scrollToBottom()" class="log-viewer__scrollButton btn btn-primary">Scroll to Bottom</button>
    }
  </div>

  @if (statusMessage(); as message) {
    <div role="status">
      @if (message.message) {
        <div class="log-viewer__message" [ngClass]="{'log-viewer__message-error': message.isError}">
          <div class="log-viewer__messageText"
            [class.text-danger]="message.isError"
            [class.text-content-muted]="!message.isError">{{ message.message }}</div>
        </div>
      }
    </div>
  }
</div>
