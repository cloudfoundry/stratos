@if ((status$ | async); as status) {
  <div
    class="absolute top-0 left-0 w-full h-1 rounded-t-lg transition-colors duration-[1ms] ease-in"
     [ngClass]="{
       'bg-success-shade-500': status === cardStatus.OK,
       'bg-warning-shade-500': status === cardStatus.WARNING,
       'bg-gray-400': status === cardStatus.TENTATIVE,
       'bg-blue-300': status === cardStatus.INCOMPLETE,
       'bg-danger-shade-500': status === cardStatus.ERROR
     }">
  </div>
}
