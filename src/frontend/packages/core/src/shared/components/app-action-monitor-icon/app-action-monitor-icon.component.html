<div class="monitor-icon">
  <div *ngIf="currentState | async as state">
    <app-custom-icon class="monitor-icon__error" *ngIf="state.error">error</app-custom-icon>
    <app-progress-spinner *ngIf="!state.error && state.busy" diameter="20" mode="indeterminate"></app-progress-spinner>
    <app-custom-icon class="monitor-icon__done" *ngIf="!state.error && !state.busy && state.completed">done</app-custom-icon>
  </div>
</div>
