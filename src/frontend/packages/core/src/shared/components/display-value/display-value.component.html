<div class="display-value">
  @if (label) {
    <div class="display-value__label">{{label}}</div>
  }
  <div class="display-value__value">
    @if (displayCustom.children.length === 0) {
      <span>{{value}}</span>
    }
    <div #displayCustom>
      <ng-content></ng-content>
    </div>
  </div>
</div>
