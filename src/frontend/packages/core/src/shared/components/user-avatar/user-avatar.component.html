<div class="user-avatar" [ngClass]="{'user-avatar__large': size === 'large'}">
  @if (!initials && !gravatar) {
    <span class="material-icons user-avatar__placeholder">account_circle</span>
  }
  @if (initials) {
    <div [ngClass]="{'user-avatar__header': color === 'header'}" class="user-avatar__initials">{{ initials }}</div>
  }
  @if (gravatar) {
    <img class="user-avatar__gravatar" [src]="gravatar" alt="">
  }
</div>
