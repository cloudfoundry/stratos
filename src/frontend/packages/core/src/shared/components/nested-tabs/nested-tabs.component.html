<div class="nested-tabs">
  <nav *ngIf="tabs" class="summary__nav tab-nav-bar">
    <a class="tab-link" *ngFor="let tab of tabs" [routerLink]="[tab.link]" routerLinkActive="active-link" #rla="routerLinkActive" [class.active]="rla.isActive">
      {{tab.label}}
    </a>
  </nav>
  <ng-content *ngIf="!tabs"></ng-content>
</div>
