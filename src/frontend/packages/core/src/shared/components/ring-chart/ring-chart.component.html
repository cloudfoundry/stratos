<div class="app-ring-chart">
  <div class="pie">
    <canvas baseChart
      [data]="chartJsData"
      [type]="'doughnut'"
      [options]="chartOptions"
      width="120"
      height="120">
    </canvas>
  </div>
  <div class="legend">
    <div class="advanced-pie-legend">
      <div class="total-value">{{ getTotal() }}</div>
      <div class="total-label">{{ label }}</div>
    </div>
    <div class="custom-legend">
      @for (item of data; track item.name || $index; let i = $index) {
        <div class="legend-item" (click)="onClick(item)">
          <div class="legend-color" [style.background-color]="getItemColor(i)"></div>
          <span class="legend-label">{{ nameFormatting ? nameFormatting(item.name) : item.name }}</span>
          <span class="legend-value">{{ valueFormatting ? valueFormatting(item.value) : item.value }}</span>
        </div>
      }
    </div>
  </div>
</div>
