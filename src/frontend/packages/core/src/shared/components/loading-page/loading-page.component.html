<ng-content></ng-content>
@if ((isLoading | async) || (isDeleting | async)) {
  <div
    [@leaveLoaderAnimation]
    class="loading-page loading-page__overlay">
    <div class="loading-page__indicator">
      @if (alert) {
        <div class="loading-page__alert">
          {{ alert }}
        </div>
      }
      <div class="loading-page__text">{{ text$ | async }}</div>
      <div class="loading-page__progress">
        <div class="loading-page__progress-bar"></div>
      </div>
      <!-- Spinner for better visual feedback -->
      <div class="loading-page__spinner-container">
        <div class="loading-page__spinner"></div>
      </div>
    </div>
  </div>
}
