<ng-content></ng-content>
@if ((isLoading | async) || (isDeleting | async)) {
  <div
    [@leaveLoaderAnimation]
    class="loading-page fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50">
    <div class="loading-page-indicator text-center max-w-md px-6">
      @if (alert) {
        <div class="loading-page-indicator-alert mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-yellow-800 text-sm">
          {{ alert }}
        </div>
      }
      <div class="text-lg text-gray-700 mb-6">{{ text$ | async }}</div>
      <div class="progress">
        <div class="progress-bar bg-primary w-full h-2 rounded-full animate-pulse"></div>
      </div>
      <!-- Spinner for better visual feedback -->
      <div class="mt-4">
        <div class="spinner-primary inline-block w-8 h-8"></div>
      </div>
    </div>
  </div>
}
