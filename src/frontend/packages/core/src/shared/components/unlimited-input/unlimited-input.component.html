<div class="unlimited-input">
  <app-form-field>
    <input type="number" [id]="name" appInput [formControlName]="name" [placeholder]="placeholder" [required]="required"
      min="0">
    <span *ngIf="suffix" matSuffix>{{suffix}}</span>
  </app-form-field>
  <app-checkbox [checked]="unlimited" (change)="onChange()">Unlimited</app-checkbox>
</div>
