<div class="relative px-12 py-6 flex flex-col gap-4">
  <!-- Full-width strip along the top edge of the dialog -->
  <app-progress-bar class="absolute inset-x-0 top-0" mode="determinate" [value]="percentage()" label="Time before sign-out">
  </app-progress-bar>
  <div class="flex flex-row items-center gap-2 p-5" data-dialog-drag-handle>
    <i aria-hidden="true" class="material-icons">pan_tool</i>
    <div class="flex-1 text-lg font-bold">
      Are you still there?
    </div>
  </div>
  <div class="flex justify-center">
    <button class="btn btn-primary" (click)="dialogRef.close(true)">Yes</button>
  </div>
</div>
