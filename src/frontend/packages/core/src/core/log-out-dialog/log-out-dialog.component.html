<div class="logout-dialog__outer">
  <mat-progress-bar class="logout-dialog__progress" mode="determinate" [value]="percentage">
  </mat-progress-bar>
  <div class="dialog-content logout-dialog__content">
    <div class="logout-dialog__message">
      <i class="material-icons">pan_tool</i>
      <div>
        Are you still there?
      </div>
    </div>
  </div>
  <div class="dialog-actions logout-dialog__actions">
    <button class="btn btn-primary" (click)="dialogRef.close()">Yes</button>
  </div>
</div>
