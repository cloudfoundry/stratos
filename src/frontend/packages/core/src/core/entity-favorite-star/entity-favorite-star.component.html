<div *ngIf="!(endpointsService.disablePersistenceFeatures$ | async)" class="favorite-star" [ngSwitch]="isFavorite$ | async" (click)="toggleFavorite($event)"
  [ngClass]="{'favorite-star__small': small}">
  <app-custom-icon *ngSwitchCase="true" matTooltip="Unset as favorite" aria-label="Set as Favorite">star</app-custom-icon>
  <app-custom-icon *ngSwitchCase="false" matTooltip="Set as favorite" aria-label="Unset as Favorite">star_border</app-custom-icon>
</div>
