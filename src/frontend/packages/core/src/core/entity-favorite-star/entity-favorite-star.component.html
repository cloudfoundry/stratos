@if ((endpointsService.disablePersistenceFeatures$ | async) === false) {
  <div class="favorite-star" role="button" tabindex="0"
    (click)="toggleFavorite($event)"
    (keydown.enter)="toggleFavorite($event)"
    (keydown.space)="toggleFavorite($event); $event.preventDefault()"
    [ngClass]="{'favorite-star__small': small}">
    @switch (isFavorite$ | async) {
      @case (true) {
        <app-custom-icon matTooltip="Unset as favorite" aria-label="Set as Favorite">star</app-custom-icon>
      }
      @case (false) {
        <app-custom-icon matTooltip="Set as favorite" aria-label="Unset as Favorite">star_border</app-custom-icon>
      }
    }
  </div>
}
