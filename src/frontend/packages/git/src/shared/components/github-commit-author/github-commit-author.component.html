@if (commit().author; as author) {
  <div class="flex items-center space-x-2">
    @if (author.html_url) {
      <a href="{{author.html_url}}" target="_blank"
      class="text-brand-600 hover:text-brand-800 font-medium">{{commit().commit?.author?.name}}</a>
    }
    @if (!author.html_url) {
      <span class="text-content-text font-medium">{{commit().commit?.author?.name}}</span>
    }
    @if (showAvatar() && author.avatar_url) {
      <img #avatar src="{{author.avatar_url}}" alt="Avatar for {{commit().commit?.author?.name}}"
        (error)="avatar.hidden = true" class="w-6 h-6 rounded-full shrink-0">
    }
  </div>
}
