<div class="flex items-center space-x-2" *ngIf="name else noUser">
  <div class="flex items-center space-x-2">
    <span class="flex-shrink-0" *ngIf="avatar">
      <img src="{{ avatar }}" alt="@{{ name }}" class="w-6 h-6 rounded-full">
    </span>
    <span class="text-gray-900">{{ name }}</span>
  </div>
</div>
<ng-template #noUser><span class="text-gray-500">-</span></ng-template>
