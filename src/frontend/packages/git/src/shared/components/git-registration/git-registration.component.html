<app-steppers [cancel]="'/endpoints'">
  <app-step title="Register" [onNext]="onNext" nextButtonText="Register" [valid]="validate | async">
    <div class="p-6">
      <h3 class="text-xl font-semibold mb-4">Select the type of {{gitTypes[epSubType].label}} to register</h3>
      <form class="space-y-4" *ngIf="registerForm" [formGroup]="registerForm">
        <div class="space-y-3" formControlName="selectedType" name="gitTypes">
          <div *ngFor="let gitTypeEntry of gitTypes[epSubType].types | keyvalue" class="block">
            <label class="flex items-start space-x-3 p-3 border rounded-lg hover:bg-gray-50 transition-colors"
              [class.opacity-50]="gitTypeEntry.value.exists" [class.cursor-not-allowed]="gitTypeEntry.value.exists">
              <input type="radio" [value]="gitTypeEntry.key" [disabled]="gitTypeEntry.value.exists"
                class="mt-1 text-primary-600 focus:ring-primary-500 border-gray-300">
              <div class="flex-1">
                <div class="font-medium text-gray-900">{{ gitTypeEntry.value.label }}</div>
                <div *ngIf="gitTypeEntry.value.description" class="mt-1 text-sm text-gray-600"
                  [class.text-gray-400]="gitTypeEntry.value.exists">
                  <p *ngFor="let p of gitTypeEntry.value.description" class="mb-1">{{p}}</p>
                </div>
              </div>
            </label>
          </div>
        </div>

        <div *ngIf="showEndpointFields" class="space-y-4 mt-6">
          <div class="form-group">
            <label for="name" class="label">Name</label>
            <input id="name" name="name" formControlName="nameField" placeholder="Name"
              class="input" [appUnique]="registerForm.value.createSystemEndpointField ? (customEndpoints | async)?.names : (existingPersonalEndpoints | async)?.names">
            <div *ngIf="registerForm.controls.nameField.errors?.required" class="text-red-600 text-sm mt-1">
              Name is required
            </div>
            <div *ngIf="registerForm.controls.nameField.errors?.appUnique" class="text-red-600 text-sm mt-1">
              Name is not unique
            </div>
          </div>
          <div class="form-group">
            <label for="url" class="label">Endpoint Address</label>
            <input id="url" name="url" formControlName="urlField" type="url" required
              placeholder="Endpoint Address" pattern="{{urlValidation}}" class="input"
              [appUnique]="registerForm.value.createSystemEndpointField ? (customEndpoints | async)?.urls : (existingPersonalEndpoints | async)?.urls">
            <div *ngIf="registerForm.controls.urlField.errors?.required" class="text-red-600 text-sm mt-1">
              URL is required
            </div>
            <div *ngIf="registerForm.controls.urlField.errors?.pattern" class="text-red-600 text-sm mt-1">
              Invalid API URL
            </div>
            <div *ngIf="registerForm.controls.urlField.errors?.appUnique" class="text-red-600 text-sm mt-1">
              URL is not unique
            </div>
          </div>
          <div class="space-y-3">
            <label *ngIf="userEndpointsAndIsAdmin | async" class="checkbox-label"
              [class.hidden]="fixedUrl">
              <input type="checkbox" name="createSystemEndpoint"
                formControlName="createSystemEndpointField" (change)="toggleCreateSystemEndpoint()"
                class="checkbox">
              <span class="checkbox-text">Create a system endpoint (visible to all users)</span>
            </label>
            <label class="checkbox-label" [class.hidden]="fixedUrl">
              <input type="checkbox" name="skipSSL" formControlName="skipSSLField" class="checkbox">
              <span class="checkbox-text">Skip SSL validation for the endpoint</span>
            </label>
          </div>
        </div>
      </form>
    </div>
  </app-step>
  <app-step title="Connect (Optional)" [valid]="connect.doConnect ? connect.valid : true" [onNext]="connect.onNext"
    [onEnter]="connect.onEnter" [disablePrevious]="true" [hideCloseButton]="true"
    [finishButtonText]="connect.doConnect ? 'Connect' : 'Finish'">
    <app-create-endpoint-connect #connect></app-create-endpoint-connect>
  </app-step>
</app-steppers>
