<app-page-header>
  <h1>Install</h1>
</app-page-header>
<div class="choices">
  @for (type of types; track type) {
    <app-card>
      <!-- <app-card-header>
      <app-card-title>{{ type.title }} </app-card-title>
    </app-card-header> -->
    <app-card-content>
      <div class="icon">
        <div>
          <img [src]="type.icon">
        </div>
      </div>
      <div class="bottom">
        <div class="description">
          {{type.description}}
        </div>
        <div class="button">
          <button (click)="edit()" class="btn btn-primary">
            Install Now!
          </button>
        </div>
      </div>
    </app-card-content>
  </app-card>
}
</div>
