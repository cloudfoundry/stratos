<app-page-header [breadcrumbs]="breadcrumbs()">
  <h1>Kubernetes Terminal</h1>
  <div class="page-header-right">
    <span>
      @if (sshViewer.isConnected()) {
        <button aria-label="Disconnect" class="btn btn-icon" matTooltip="Disconnect" name="stop" (click)="sshViewer.disconnect()" [disabled]="sshViewer.attemptingConnection()">
          <span aria-hidden="true" class="material-icons">stop</span>
        </button>
      }
      @if (!sshViewer.isConnected()) {
        <button aria-label="Connect" class="btn btn-icon" matTooltip="Connect" name="start" (click)="sshViewer.reconnect()" [disabled]="sshViewer.attemptingConnection()">
          <span aria-hidden="true" class="material-icons">play_arrow</span>
        </button>
      }
      <button aria-label="Back" class="btn btn-icon" matTooltip="Back" [routerLink]="kubeSummaryLink">
        <span aria-hidden="true" class="material-icons">close</span>
      </button>
    </span>
  </div>
</app-page-header>

<app-ssh-viewer #sshViewer [errorMessage]="errorMessage()" [sshStream]="messages" [sshInput]="sshInput" [connectionStatus]="connectionStatus"></app-ssh-viewer>
