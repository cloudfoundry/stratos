<app-page-header [breadcrumbs]="breadcrumbs$ | async">
  <h1>Kubernetes Terminal</h1>
  <div class="page-header-right">
    <span>
      @if (sshViewer.isConnected) {
        <button class="btn btn-icon" matTooltip="Disconnect" name="stop" (click)="sshViewer.disconnect()" [disabled]="sshViewer.attemptingConnection">
          <span class="material-symbols-outlined">stop</span>
        </button>
      }
      @if (!sshViewer.isConnected) {
        <button class="btn btn-icon" matTooltip="Connect" name="start" (click)="sshViewer.reconnect()" [disabled]="sshViewer.attemptingConnection">
          <span class="material-symbols-outlined">play_arrow</span>
        </button>
      }
      <button class="btn btn-icon" matTooltip="Back" [routerLink]="kubeSummaryLink">
        <span class="material-symbols-outlined">close</span>
      </button>
    </span>
  </div>
</app-page-header>

<app-ssh-viewer #sshViewer [errorMessage]="errorMessage" [sshStream]="messages" [sshInput]="sshInput" [connectionStatus]="connectionStatus"></app-ssh-viewer>
