<app-meta-card class="cursor-pointer focus:outline-none" [routerLink]="row.guid">
  <app-meta-card-title>
    <div class="flex flex-row justify-between w-full">
      <app-multiline-title>{{ row.name }}</app-multiline-title>
      <div class="flex self-end">
        @if (icon) {
          <img class="h-12 w-12 object-contain" [src]="icon" (error)="loadImageError()">
        } @else {
          <app-custom-icon class="text-5xl h-12 w-12" fontSet="stratos-icons">workloads</app-custom-icon>
        }
      </div>
    </div>
  </app-meta-card-title>
  <app-meta-card-item>
    <app-meta-card-key>Cluster</app-meta-card-key>
    <app-meta-card-value>
      <app-table-cell-endpoint-name [row]="row"></app-table-cell-endpoint-name>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Namespace</app-meta-card-key>
    <app-meta-card-value>
      <a routerLink="/kubernetes/{{row.endpointId}}/namespaces/{{row.namespace}}">{{ row.namespace}}</a>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Status</app-meta-card-key>
    <app-meta-card-value>
      {{ row.status | titlecase }}
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Chart Version</app-meta-card-key>
    <app-meta-card-value>
      {{ row.chart.metadata.version }}
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Last Deployed</app-meta-card-key>
    <app-meta-card-value>
      {{ row.info.last_deployed | date:'medium' }}
    </app-meta-card-value>
  </app-meta-card-item>
</app-meta-card>
