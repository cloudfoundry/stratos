<app-page-sub-nav>

  <div class="flex bg-gray-100 rounded-lg p-1 toolbar" role="group" aria-label="View">
    <button class="btn btn-toggle"
            [class.btn-toggle-active]="(viewType$ | async) === 'user'"
            (click)="viewTypeChange('user')"
            name="view-user">User</button>
    <button class="btn btn-toggle"
            [class.btn-toggle-active]="(viewType$ | async) === 'chart'"
            (click)="viewTypeChange('chart')"
            name="view-chart">Chart</button>
    <button class="btn btn-toggle"
            [class.btn-toggle-active]="(viewType$ | async) === 'combined'"
            (click)="viewTypeChange('combined')"
            name="view-combined">Combined</button>
  </div>

  <button class="btn btn-secondary" name="expand_all" (click)="viewer.expand()" title="Expand all">
    <span class="material-icons">expand_more</span>
    <span>Expand all</span>
  </button>
  <button class="btn btn-secondary" name="collapse_all" (click)="viewer.collapse()" title="Collapse all">
    <span class="material-icons">expand_less</span>
    <span>Collapse all</span>
  </button>
</app-page-sub-nav>

<app-json-viewer #viewer [json]="values$ | async"></app-json-viewer>
<!-- <div *ngIf="values$ | async as values; else noValues">
  <app-json-viewer #viewer [json]="values"></app-json-viewer>
</div> -->
<ng-template #noValues>
  <app-no-content-message [icon]="'list'" [firstLine]="'There are no release values'"></app-no-content-message>
</ng-template>
