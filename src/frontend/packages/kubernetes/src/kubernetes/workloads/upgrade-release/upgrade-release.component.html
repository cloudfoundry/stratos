<app-page-header>
  Upgrade Workload
</app-page-header>
<app-steppers [cancel]="cancelUrl">
  <app-step title="Version" [signalHandle]="versionStepHandle">
    @if (listConfig(); as cfg) {
      <app-signal-list class="w-full h-[28rem] block" [config]="cfg"></app-signal-list>
    }
  </app-step>
  <app-step title="Overrides" [signalHandle]="overridesStepHandle">
    <app-chart-values-editor #editor [config]="config"></app-chart-values-editor>
  </app-step>

  <!-- Add support for recreate pods and other advanced options in the future
  <app-step [hidden]="!showAdvancedOptions" [onNext]="doUpgrade" title="Advanced" finishButtonText="Upgrade">
    Advanced Options
  </app-step>
  -->

</app-steppers>
