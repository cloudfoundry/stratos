<app-page-header [breadcrumbs]="breadcrumbs$ | async">
  <h1>Dashboard</h1>
  <div class="page-header-right" [ngClass]="{'hidden': (isLoading$ | async) }">
    @if (expanded) {
      <button (click)="toggle()" class="btn btn-icon" title="Collapse">
        <span class="material-icons">expand_less</span>
      </button>
    }
    @if (!expanded) {
      <button (click)="toggle()" class="btn btn-icon" title="Expand">
        <span class="material-icons">expand_more</span>
      </button>
    }
  </div>
</app-page-header>

<app-loading-page [isLoading]="isLoading$" text="Loading Kubernetes dashboard">
  @if (!(hasError$ | async) && source) {
    <iframe #kubeDash (load)="iframeLoaded()" id="kubedash" [src]="source" class="w-full h-full border-0"></iframe>
  }
  @if (hasError$ | async) {
    <div class="flex flex-col items-center justify-center p-8 text-center">
      @if (errorMsg(); as message) {
        <app-no-content-message icon="warning" [hidden]="!message" [firstLine]="message.firstLine" [secondLine]="message.secondLine">
        </app-no-content-message>
      }
      <a [routerLink]="configUrl()" class="btn btn-primary mt-4">Check Dashboard Configuration</a>
    </div>
  }
</app-loading-page>
