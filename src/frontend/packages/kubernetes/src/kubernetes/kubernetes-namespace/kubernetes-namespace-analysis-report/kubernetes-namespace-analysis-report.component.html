<app-page-sub-nav [breadcrumbs]="breadcrumbs">

  <app-analysis-report-runner [kubeId]="endpointID" [namespace]="kubeNamespaceService.namespaceName">
  </app-analysis-report-runner>

  <app-analysis-report-selector prompt="Report" [allowNone]="false" (selected)="analysisChanged($event)"
    [autoSelect]="true" [endpoint]="endpointID" (reportCount)="onReportCount($event)" [path]="path">
  </app-analysis-report-selector>
</app-page-sub-nav>

<app-analysis-report-viewer [report]="report$ | async"></app-analysis-report-viewer>
@if (noReportsAvailable) {
  <app-no-content-message icon="assignment" [hidden]="false" firstLine="No reports available">
  </app-no-content-message>
}
