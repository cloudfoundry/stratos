<div class="h-full">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">General Information</h3>
    </div>
    <div class="card-content">
      <div class="kubernetes-node-summary-card__content">
        <app-metadata-item icon="title" label="Name"
          >{{ kubeNodeService.node()?.metadata?.name }}
        </app-metadata-item>
        <app-metadata-item icon="today" label="Created">
          {{
            kubeNodeService.node()?.metadata?.creationTimestamp | date: "medium"
          }}</app-metadata-item
        >
        @if (caaspNode(); as caaspNode) {
          @if (caaspNode.version) {
            <app-metadata-item icon="info_outline" label="CaaSP Version"> {{ caaspNode.version }}</app-metadata-item>
          }
          <app-kubernetes-node-condition
            [inverse]="true"
            [subtle]="false"
            type="no-yes"
            condition="CaaspUpdates"
            [overrideCondition]="caaspNode.updates"
            [paddingTop]="'0'"
          >
          </app-kubernetes-node-condition>
          <app-kubernetes-node-condition
            [inverse]="true"
            [subtle]="false"
            type="no-yes"
            condition="CaaspDisruptive"
            [overrideCondition]="caaspNode.disruptiveUpdates"
            [paddingTop]="'12px'"
          >
          </app-kubernetes-node-condition>
          <app-kubernetes-node-condition
            [inverse]="true"
            [subtle]="false"
            type="no-yes"
            condition="CaaspSecurity"
            [overrideCondition]="caaspNode.securityUpdates"
            [paddingTop]="'12px'"
          >
          </app-kubernetes-node-condition>
        }
      </div>
    </div>
  </div>
</div>
