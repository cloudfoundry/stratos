@if (hasCondition$ | async) {
  <div class="flex flex-row items-center justify-between mr-5 pt-5" [ngStyle]="{'padding-top': paddingTop}">
    <div class="flex items-center justify-center">
      <span [class]="icons[condition][1]">{{ icons[condition][0] }}</span>
      <div>
        <span class="ml-2.5">{{ titles[condition] }}</span>
      </div>
    </div>
    <app-boolean-indicator class="min-w-[50px]" [subtle]="subtle" [inverse]="inverse"
    [isTrue]="condition$ | async" [type]="type"></app-boolean-indicator>
  </div>
}
