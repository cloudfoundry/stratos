@if (row; as kubeService) {
  @if (!!kubeService.spec?.ports.length) {
    <table>
      <tr>
        <th>Name</th>
        <th>Protocol</th>
        <th>Port</th>
        <th>Target Port</th>
        <th>Node Port</th>
      </tr>
      @for (port of kubeService.spec?.ports; track port) {
        <tr>
          <td>{{port.name}}</td>
          <td>{{port.protocol}}</td>
          <td>{{port.port}}</td>
          <td>{{port.targetPort}}</td>
          <td>{{port.nodePort}}</td>
        </tr>
      }
    </table>
  } @else {
    -
  }
} @else {
  -
}
