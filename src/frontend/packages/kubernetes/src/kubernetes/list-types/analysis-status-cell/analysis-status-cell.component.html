@if (row.status === 'running') {
  <div class="status__running">
    <app-progress-spinner diameter="20" mode="indeterminate"></app-progress-spinner> Running
  </div>
}
@if (row.status === 'completed') {
  <div>Completed</div>
}
@if (row.status === 'error') {
  <div class="status__error">
    <div>Error</div>
    @if (row.error) {
      <span class="material-symbols-outlined text-warning" matTooltip="{{ row.error }}">warning</span>
    }
  </div>
}
