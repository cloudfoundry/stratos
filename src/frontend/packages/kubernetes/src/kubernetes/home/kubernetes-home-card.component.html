<app-tile-grid [fit]="true">
  <app-tile-group class="tile-group-3-cols tile-group-compact">
    <app-tile>
      <app-card-number-metric mode="plain" link="/kubernetes/{{endpoint().guid}}/nodes" icon="apps" label="Nodes"
        labelSingular="Node" value="{{ nodeCount() }}">
      </app-card-number-metric>
    </app-tile>
    <app-tile>
      <app-card-number-metric mode="plain" link="/kubernetes/{{endpoint().guid}}/resource/namespace" icon="language"
        label="Namespaces" labelSingular="Namespace" value="{{ namespaceCount() }}">
      </app-card-number-metric>
    </app-tile>
    <app-tile>
      <app-card-number-metric mode="plain" link="/kubernetes/{{endpoint().guid}}/resource/pod" icon="apps" label="Pods"
        labelSingular="Pod" value="{{ podCount() }}">
      </app-card-number-metric>
    </app-tile>
  </app-tile-group>
</app-tile-grid>
@if (failureReason(); as reason) {
  <div data-test="kube-card-failure" class="px-2 text-sm text-danger-shade-700 break-words">Failed to load: {{ reason }}</div>
}
