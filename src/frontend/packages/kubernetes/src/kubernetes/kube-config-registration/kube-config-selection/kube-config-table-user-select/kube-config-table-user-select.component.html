<div *ngIf="hasUser">
  <app-select [(value)]="selected" (selectionChange)="valueChanged($event.value)">
    <app-option [value]="''">Register Only</app-option>
    <app-option *ngFor="let user of row._users" [value]="user.name">{{ user.name }}</app-option>
  </app-select>
</div>
<div *ngIf="!hasUser">
  No user found, register only
</div>
