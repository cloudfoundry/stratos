<app-progress-spinner *ngIf="!(initialValue$ | async); else haveInitialValue" diameter="20" mode="indeterminate">
</app-progress-spinner>
<ng-template #haveInitialValue>
  <app-checkbox [checked]="(initialValue$ | async).checked" (change)="valueChanged($event.checked)" color="primary">
  </app-checkbox>
</ng-template>
