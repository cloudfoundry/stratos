@if (canShow$ | async) {
  @if (analyzers$ | async; as analyzers) {
    <div class="relative">
      @if (isMenuOpen) {
        <div class="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-md shadow-lg z-50 min-w-48">
          @for (analyzer of analyzers; track analyzer) {
            <button (click)="onSelected(analyzer); closeMenu()"
              class="w-full text-left px-4 py-2 text-sm text-content-text hover:bg-gray-100 first:rounded-t-md"
            >{{ analyzer.title }}</button>
          }
          @if (analyzers.length > 0) {
            <div class="border-t border-gray-200 my-1"></div>
          }
          <button (click)="refreshReports($event); closeMenu()"
          class="w-full text-left px-4 py-2 text-sm text-content-text hover:bg-gray-100 rounded-b-md">Refresh</button>
        </div>
      }
      <!--
      See #417
      Note - it would be good to only show if there's no reports `*ngIf="analyzers.length > 0"`. However this causes
      issues when arriving on an empty page and kicking off a run. The call to refresh the list returns too quickly and
      doesn't contain the new report. This leaves user with no way to see report/refresh reports list
      -->
      <button (click)="toggleMenu()" class="flex items-center justify-between px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500">
        <span class="text-content-text">{{ prompt }}</span>
        @if (selection) {
          <span class="text-content-text">: {{ selection.title }}</span>
        }
        <span class="material-icons text-content-muted ml-2">arrow_drop_down</span>
      </button>
    </div>
  }
}
