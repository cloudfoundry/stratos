@if (canShow$ | async) {
  @if (analyzers$ | async; as analyzers) {
    <div class="report-runner">
      <div class="relative inline-block">
        @if (analyzers.length > 0) {
          <button class="btn btn-ghost report-runner__run"
            (click)="menuOpen = !menuOpen"
            >
            <span>Analyze</span>
            <span class="material-symbols-outlined">arrow_drop_down</span>
          </button>
        }
        @if (menuOpen) {
          <div
            class="absolute right-0 mt-1 w-56 bg-white dark:bg-neutral-800 rounded-md shadow-lg ring-1 ring-black ring-opacity-5 z-50">
            <div class="py-1">
              @for (analyzer of analyzers; track analyzer) {
                <button (click)="runAnalysis(analyzer.id); menuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-neutral-700">
                  {{ analyzer.name }}
                </button>
              }
              <div class="border-t border-neutral-200 dark:border-neutral-700 my-1 report-runner__divider"></div>
              <button (click)="showAnalyzersInfo(); menuOpen = false"
                class="block w-full text-left px-4 py-2 text-sm text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-neutral-700">
                Analyzer Info
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  }
}
