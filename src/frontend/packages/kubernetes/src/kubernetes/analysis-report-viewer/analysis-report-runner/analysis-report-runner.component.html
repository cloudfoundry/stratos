<ng-container *ngIf="canShow$ | async">
  <div *ngIf="analyzers$ | async as analyzers" class="report-runner">
    <mat-menu #appMenu="matMenu">
      <button (click)="runAnalysis(analyzer.id)" mat-menu-item
        *ngFor="let analyzer of analyzers">{{ analyzer.name }}</button>
      <mat-divider class="report-runner__divider"></mat-divider>
      <button (click)="showAnalyzersInfo()" mat-menu-item>Analyzer Info</button>
    </mat-menu>

    <button class="btn btn-ghost report-runner__run" [matMenuTriggerFor]="appMenu" *ngIf="analyzers.length > 0">
      <span>Analyze</span>
      <span class="material-symbols-outlined">arrow_drop_down</span>
    </button>
  </div>
</ng-container>
