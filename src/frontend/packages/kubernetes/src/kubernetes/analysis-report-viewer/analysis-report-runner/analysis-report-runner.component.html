@if (canShow$ | async) {
  @if (analyzers$ | async; as analyzers) {
    <div class="flex items-center justify-center">
      <div class="relative inline-block">
        @if (analyzers.length > 0) {
          <button class="btn btn-ghost pr-0"
            (click)="menuOpen = !menuOpen"
            >
            <span>Analyze</span>
            <span class="material-symbols-outlined">arrow_drop_down</span>
          </button>
        }
        @if (menuOpen) {
          <div
            class="absolute right-0 mt-1 w-56 bg-content-bg rounded-md shadow-lg ring-1 ring-black/5 z-50">
            <div class="py-1">
              @for (analyzer of analyzers; track analyzer) {
                <button (click)="runAnalysis(analyzer.id); menuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-content-text hover:bg-content-secondary">
                  {{ analyzer.name }}
                </button>
              }
              <div class="border-t border-content-border my-1"></div>
              <button (click)="showAnalyzersInfo(); menuOpen = false"
                class="block w-full text-left px-4 py-2 text-sm text-content-text hover:bg-content-secondary">
                Analyzer Info
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  }
}
