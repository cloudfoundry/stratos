<div *ngFor="let group of processed" class="report__group">
  <div class="report__group-name">{{ group._name }}</div>
  <div *ngFor="let check of group._checks" class="report__checks">
    <div class="report__check">
      <div [ngSwitch]="check.Grade" class="report__icon">
        <span class="material-symbols-outlined text-success" *ngSwitchCase="10">check_circle</span>
        <span class="material-symbols-outlined text-info" *ngSwitchCase="7">info</span>
        <span class="material-symbols-outlined text-warning" *ngSwitchCase="5">warning</span>
        <span class="material-symbols-outlined text-danger" *ngSwitchCase="1">error</span>
        <span class="material-symbols-outlined text-tentative" *ngSwitchDefault>help_outline</span>
      </div>
    <div class="report__check-name">{{ check.Check.Name }}</div>
    </div>
    <div *ngFor="let comment of check.Comments" class="report__comment">
      <div>{{ comment.Summary }}</div>
    </div>
  </div>
</div>
