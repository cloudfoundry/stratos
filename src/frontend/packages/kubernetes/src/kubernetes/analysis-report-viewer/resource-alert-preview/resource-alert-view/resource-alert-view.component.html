@if (alertInfo) {
  <div>
    @for (group of alertInfo; track group) {
      <div>
        @if (showHeader) {
          <div class="alert__group">{{group.name}}</div>
        }
        @for (alert of group.alerts; track alert) {
          <div>
            <div class="alert__info">
              <div class="alert__icon">
                @switch (alert.level) {
                  @case (1) {
                    <span class="material-symbols-outlined text-info">info</span>
                  }
                  @case (2) {
                    <span class="material-symbols-outlined text-warning">warning</span>
                  }
                  @case (3) {
                    <span class="material-symbols-outlined text-danger">error</span>
                  }
                  @default {
                    <span class="material-symbols-outlined text-tentative">help_outline</span>
                  }
                }
              </div>
              {{ alert.message }}
            </div>
          </div>
        }
      </div>
    }
  </div>
}
