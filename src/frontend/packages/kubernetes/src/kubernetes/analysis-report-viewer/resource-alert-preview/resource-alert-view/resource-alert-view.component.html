<div *ngIf="alertInfo">
  <div *ngFor="let group of alertInfo">
    <div *ngIf="showHeader" class="alert__group">{{group.name}}</div>
    <div *ngFor="let alert of group.alerts">
      <div class="alert__info">
        <div [ngSwitch]="alert.level" class="alert__icon">
          <span class="material-symbols-outlined text-info" *ngSwitchCase="1">info</span>
          <span class="material-symbols-outlined text-warning" *ngSwitchCase="2">warning</span>
          <span class="material-symbols-outlined text-danger" *ngSwitchCase="3">error</span>
          <span class="material-symbols-outlined text-tentative" *ngSwitchDefault>help_outline</span>
        </div>
        {{ alert.message }}
      </div>
    </div>
  </div>
</div>
