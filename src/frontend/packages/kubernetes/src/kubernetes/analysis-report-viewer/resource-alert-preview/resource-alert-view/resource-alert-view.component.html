@if (alertInfo(); as groups) {
  <div>
    @for (group of groups; track group) {
      <div>
        @if (showHeader()) {
          <div class="font-bold py-1">{{group.name}}</div>
        }
        @for (alert of group.alerts; track alert) {
          <div>
            <div class="flex items-center mx-5 my-1">
              <div class="mr-2">
                @switch (alert.level) {
                  @case (1) {
                    <span class="material-icons text-info" role="img" aria-label="Info">info</span>
                  }
                  @case (2) {
                    <span class="material-icons text-warning" role="img" aria-label="Warning">warning</span>
                  }
                  @case (3) {
                    <span class="material-icons text-danger" role="img" aria-label="Error">error</span>
                  }
                  @default {
                    <span class="material-icons text-tentative" role="img" aria-label="Unknown">help_outline</span>
                  }
                }
              </div>
              {{ alert.message }}
            </div>
          </div>
        }
      </div>
    }
  </div>
}
