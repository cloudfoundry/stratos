<div [formGroup]="formGroup">
  <div formGroupName="authValues" class="flex flex-col">
    <label class="text-sm mb-3" for="kube-token">Token:</label>
    <textarea id="kube-token" rows="10" appInput formControlName="token"
      class="w-full focus:outline-none min-h-[200px] resize-y font-mono text-sm [line-break:anywhere] border border-content-border rounded-md p-3 bg-content-bg focus:border-primary focus:ring-1 focus:ring-primary"></textarea>
  </div>
</div>
