<div [formGroup]="formGroup">
  <div formGroupName="authValues" class="flex flex-col h-[250px] w-[450px]">
    <app-tab-group>
      <app-tab label="Certificate Files">
        <div class="flex flex-col pt-4">
          <span>Specify Certificate file:</span>
          <app-file-input fileFormControlName="cert" placeholder="cert">
          </app-file-input>
          <span>Specify Certificate key file:</span>
          <app-file-input fileFormControlName="certKey" placeholder="certKey">
          </app-file-input>
          <input formControlName="cert" hidden="true">
          <input formControlName="certKey" hidden="true">
        </div>
      </app-tab>
      <app-tab label="Certificate Content">
        <div class="kube-certs-auth__content" spellcheck="false">
          <span class="text-sm">Specify Certificate:</span>
          <textarea formControlName="cert"></textarea>
          <span class="text-sm">Specify Certificate key:</span>
          <textarea formControlName="certKey"></textarea>
        </div>
      </app-tab>
    </app-tab-group>
  </div>
</div>
