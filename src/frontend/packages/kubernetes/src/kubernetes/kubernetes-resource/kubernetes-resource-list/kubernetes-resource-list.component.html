<app-page-sub-nav>
  @if (namespaces$) {
    <div class="sub-nav-menu-button">
      <div class="relative inline-block">
        <button class="btn btn-ghost sub-nav-menu-button__btn"
          [class.opacity-50]="!isNamespacedView"
          (click)="menuOpen = !menuOpen">
          @if (selectedNamespace) {
            <span class="stratos-icons sub-nav-menu-button__icon">namespace</span>
          }
          <span class="flex-1 overflow-hidden text-left truncate whitespace-nowrap">{{ selectedNamespace || 'All namespaces'}}</span>
          <span class="material-symbols-outlined m-0 ml-2.5">arrow_drop_down</span>
        </button>
        @if (menuOpen) {
          <div
            class="absolute left-0 mt-1 w-56 bg-white dark:bg-neutral-800 rounded-md shadow-lg ring-1 ring-black ring-opacity-5 z-50">
            <div class="py-1">
              <button (click)="select('*'); menuOpen = false"
                class="block w-full text-left px-4 py-2 text-sm text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-neutral-700">
                All namespaces
              </button>
              @for (ns of namespaces$ | async; track ns) {
                <button
                  (click)="select(ns); menuOpen = false"
                  class="block w-full text-left px-4 py-2 text-sm text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-neutral-700">
                  {{ ns }}
                </button>
              }
            </div>
          </div>
        }
      </div>
    </div>
  }
</app-page-sub-nav>

<app-list-view [config]="provider"></app-list-view>
