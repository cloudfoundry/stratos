<div class="list-filters">
  @for (filter of filters; track filter) {
    <div class="list-filters_section">
      <h3 class="list-filters_section_title">{{ filter.title }}</h3>
      @for (item of filter.items; track item; let i = $index) {
        <div class="list-filters_section_link" [class.active]="item.selected" (click)='filter.onSelect(i)'>
          {{ item.title }}
        </div>
      }
    </div>
  }
</div>
