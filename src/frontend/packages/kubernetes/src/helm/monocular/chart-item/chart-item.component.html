<app-list-item class="chart-item" [detailUrl]="goToDetailUrl()" height="auto"
  [artifactHubAndHelmRepoTypes$]="artifactHubAndHelmRepoTypes$" [chart]="chart">
  <img class="list-item-logo max-h-[80%] max-w-[80%]" alt="{{ chart.attributes.name }}'s logo" src="{{ iconUrl }}" />
  <div class="list-item-info">
    <h2 class="m-0 mb-1 font-medium text-base cursor-pointer">
      <a class="text-inherit" [href]="goToDetailUrl()"
      [routerLink]="goToDetailUrl()">{{ chart.attributes.repo.name }}/{{ chart.attributes.name }}</a>
    </h2>
    <p class="m-0">
      @if (showVersion && chart.relationships.latestChartVersion.data.app_version) {
        <span class="text-sm">
        {{ chart.relationships.latestChartVersion.data.app_version }}</span>
      }
    </p>
    @if (showDescription) {
      <div class="m-4">
        {{ chart.attributes.description }}
      </div>
    }
  </div>
</app-list-item>
