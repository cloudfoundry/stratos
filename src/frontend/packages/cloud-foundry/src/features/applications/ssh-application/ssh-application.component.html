<app-page-header [breadcrumbs]="breadcrumbs$ | async">
  <h1>SSH (#{{ instanceId }})</h1>
  <div class="page-header-right">
    <span>
      <button class="btn btn-icon" matTooltip="Disconnect" name="stop" *ngIf="sshViewer.isConnected" (click)="sshViewer.disconnect()" [disabled]="sshViewer.attemptingConnection">
        <span class="material-icons">stop</span>
      </button>
      <button class="btn btn-icon" matTooltip="Connect" name="start" *ngIf="!sshViewer.isConnected" (click)="sshViewer.reconnect()" [disabled]="sshViewer.attemptingConnection">
        <span class="material-icons">play_arrow</span>
      </button>
      <button class="btn btn-icon" matTooltip="Back to App" [routerLink]="appInstanceLink">
        <span class="material-icons">close</span>
      </button>
    </span>
  </div>
</app-page-header>

<app-ssh-viewer #sshViewer [errorMessage]="errorMessage" [sshStream]="messages" [sshInput]="sshInput" [connectionStatus]="connectionStatus"></app-ssh-viewer>
