<div class="flex items-center px-3 py-3 h-[43px] border-b border-content-border shrink-0">
  <div class="flex-1 font-semibold">{{ deployer ? deployer.streamTitle : 'Pending' }}</div>
  @if (deployer && deployer.deploying) {
    <div class="w-5 h-5 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
  }
</div>
@if (deployer) {
  <app-log-viewer class="flex-1 min-h-0 flex" [logStream]="deployer.messages.asObservable()">
  </app-log-viewer>
}
