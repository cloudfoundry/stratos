@let d = deployer();
<div class="flex items-center px-3 py-3 h-[43px] border-b border-content-border shrink-0">
  <div class="flex-1 font-semibold">{{ d ? d.streamTitle() : 'Pending' }}</div>
  @if (d?.deploying()) {
    <app-busy class="text-primary" size="1.25rem" context="deploy"></app-busy>
  }
</div>
@if (d) {
  <app-log-viewer class="flex-1 min-h-0 flex" [logStream]="logStream()">
  </app-log-viewer>
}
