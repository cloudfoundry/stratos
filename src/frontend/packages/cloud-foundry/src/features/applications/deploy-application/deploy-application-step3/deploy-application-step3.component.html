@if (showOverlay$ | async) {
  <div class="deploy-app">
    <div class="deploy-app__title">{{ deployer ? deployer.streamTitle : 'Pending' }}</div>
    @if (deployer && deployer.deploying) {
      <div class="spinner spinner-primary w-5 h-5"></div>
    }
  </div>
}
@if (deployer && deployer.messages) {
  <app-log-viewer class="deploy-app__log" [logStream]="deployer.messages">
  </app-log-viewer>
}
