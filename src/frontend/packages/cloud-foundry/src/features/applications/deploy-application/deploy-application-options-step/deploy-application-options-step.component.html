<form [formGroup]="deployOptionsForm" validate class="stepper-form deploy-options">
  <div class="deploy-options__description">Override the manifest using the following options</div>
  @if ((sourceType$ | async); as sourceType) {
    <div class="deploy-options__form-sections">
      <div class="deploy-options__form-sections__form-section">
        <!--- Section -->
        <div class="deploy-options__title"><b>General</b></div>
        <div class="form-field" [ngClass]="{'hidden': sourceType.id === DEPLOY_TYPES_IDS.DOCKER_IMG}">
          <input class="input" placeholder="Application Name" formControlName="name">
        </div>
        <div class="form-field">
          <input class="input" name="instanceCount" placeholder="Number of Instances" formControlName="instances"
            type="number">
        </div>
        <!--- End Section -->
        <!--- Section -->
        <div class="deploy-options__title"><b>Quota</b></div>
        <div class="form-field">
          <div class="relative">
            <input class="input pr-10" name="diskQuota" placeholder="Disk Quota" formControlName="disk_quota" type="number">
            <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-content-muted">MB</span>
          </div>
        </div>
        <div class="form-field">
          <div class="relative">
            <input class="input pr-10" name="memoryQuota" placeholder="Memory Quota" formControlName="memory" type="number">
            <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-content-muted">MB</span>
          </div>
        </div>
        <!--- End Section -->
        <!--- Section -->
        <div class="deploy-options__title"><b>Route</b></div>
        <div class="flex flex-col space-y-2">
          <label class="flex items-center space-x-2">
            <input type="checkbox" name="no_route" formControlName="no_route" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
            <span class="text-sm">Do not create a route</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="checkbox" name="random_route" formControlName="random_route" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
            <span class="text-sm">Create a random route</span>
          </label>
        </div>
        <div class="form-field">
          <input class="input" name="host" placeholder="Host" formControlName="host">
        </div>
        <div class="form-field">
          <select class="input" name="domain" formControlName="domain">
            <option value="" disabled>Domain</option>
            @for (domain of domains$ | async; track domain) {
              <option [value]="domain.entity.name">
                {{ domain.entity.name }}
              </option>
            }
          </select>
        </div>
        <div class="form-field">
          <div class="relative">
            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-content-muted">/&nbsp;</span>
            <input class="input pl-8" name="path" placeholder="Path" formControlName="path">
          </div>
        </div>
        <!--- End Section -->
      </div>
      <div class="deploy-options__form-sections__form-section">
        <!--- Section -->
        <div class="deploy-options__title"><b>Build</b></div>
        <div class="form-field">
          <label class="flex items-center space-x-2">
            <input type="checkbox" name="no_start" formControlName="no_start" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
            <span class="text-sm">Do not start the application</span>
          </label>
        </div>
        <div class="form-field">
          <select class="input" name="stack" formControlName="stack">
            <option value="">Stack</option>
            @for (stack of stacks$ | async; track stack) {
              <option [value]="stack.entity.name">
                {{ stack.entity.name }}
              </option>
            }
          </select>
        </div>
        <div class="form-field">
          <input class="input" name="buildpack" placeholder="Custom buildpack" formControlName="buildpack">
          <p class="mt-1 text-sm text-content-muted">Custom buildpack by name or Git URL</p>
        </div>
        <div class="form-field" [ngClass]="{'hidden': sourceType.id === DEPLOY_TYPES_IDS.DOCKER_IMG}">
          <input class="input" placeholder="Docker Image" formControlName="dockerImage">
        </div>
        <div class="form-field" [ngClass]="{'hidden': sourceType.id === DEPLOY_TYPES_IDS.DOCKER_IMG}">
          <input class="input" placeholder="Docker Username" formControlName="dockerUsername">
          <p class="mt-1 text-sm text-content-muted">Docker Username works with the Application's `CF_DOCKER_PASSWORD` environment variable</p>
        </div>
        <!--- End Section -->
      </div>
      <div class="deploy-options__form-sections__form-section">
        <!--- Section -->
        <div class="deploy-options__title"><b>Run</b></div>
        <div class="form-field">
          <input class="input" name="startCommand" placeholder="Start Command" formControlName="startCmd">
        </div>
        <div class="form-field">
          <select class="input" name="healthCheckType" formControlName="healthCheckType">
            <option value="">Health Check Type</option>
            @for (check of healthCheckTypes; track check) {
              <option [value]="check">
                {{ check }}
              </option>
            }
          </select>
        </div>
        <div class="form-field">
          <div class="relative">
            <input class="input pr-20" name="healthCheckTimeout" placeholder="Health Check Timeout" formControlName="time"
              type="number">
            <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-content-muted">seconds</span>
          </div>
        </div>
        <!--- End Section -->
      </div>
    </div>
  }
</form>
