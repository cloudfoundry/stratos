<b>Create a route</b>
<form [formGroup]="setDomainHost" class="stepper-form">
  <app-form-field>
    <app-select placeholder="Domain" name="domain" formControlName="domain">
      @for (domain of (domains$ | async); track domain) {
        <app-option [value]="domain.metadata.guid">
          <span>{{ domain.entity.name }}</span>
        </app-option>
      }
    </app-select>
  </app-form-field>
  <app-form-field>
    <input required formControlName="host" appInput placeholder="Host" name="hostName">
    @if (setDomainHost.controls['host']?.errors?.maxlength) {
      <app-error>Host cannot exceed 63 characters</app-error>
    }
  </app-form-field>
</form>
