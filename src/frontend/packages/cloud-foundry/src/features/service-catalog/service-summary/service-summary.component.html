@let off = offering();
@let bGuid = brokerGuid();
@let brokerAvailable = isBrokerAvailable();

<div class="summary">
  <app-tile-grid fit="true">
    @if (brokerAvailable) {
      <app-tile-group class="tile-group-2-cols">
        <app-tile>
          <app-service-summary-card [offering]="off"></app-service-summary-card>
        </app-tile>
        <app-tile>
          <app-service-broker-card [cfGuid]="cfGuid" [brokerGuid]="bGuid"></app-service-broker-card>
        </app-tile>
      </app-tile-group>
    } @else {
      <app-tile-group class="tile-group-1-cols">
        <app-tile>
          <app-service-summary-card [offering]="off"></app-service-summary-card>
        </app-tile>
      </app-tile-group>
    }
    <app-tile-group class="tile-group-2-cols">
      <app-tile>
        <app-card-number-metric [link]="serviceInstancesLink" icon="service_instance" iconFont="stratos-icons" label="Instances" labelSingular="Instance" value="{{ instancesCount() }}"></app-card-number-metric>
      </app-tile>
      <app-tile>
        <app-card-number-metric [link]="servicePlansLink" icon="service_plan" iconFont="stratos-icons" label="Service Plans" labelSingular="Service Plan" value="{{ plansCount() }}"></app-card-number-metric>
      </app-tile>
    </app-tile-group>
    <app-tile-group class="tile-group-1-cols">
      <app-tile>
        <app-service-recent-instances-card [cfGuid]="cfGuid" [serviceGuid]="serviceGuid"></app-service-recent-instances-card>
      </app-tile>
    </app-tile-group>
  </app-tile-grid>
</div>
