<app-page-header [tabs]="tabLinks" tabsHeader="Service" [breadcrumbs]="breadcrumbs">
  <div class="app-page-header">
    {{ serviceLabel$ | async }}
  </div>
  <div class="page-header-right">
    <ng-container *appCfUserPermission="canCreateServiceInstance">
      <button class="btn btn-primary flex items-center justify-center w-10 h-10 rounded-full p-0" name="add-service-instance" [routerLink]="addServiceInstanceLink"
        [queryParams]="isServiceSpaceScoped$ | async" [disabled]="!(hasVisiblePlans$ | async)">
        <span class="material-icons" [title]="toolTipText$ | async">add</span>
      </button>
    </ng-container>
  </div>
</app-page-header>
<app-loading-page [text]="'Retrieving Service details'" class="router-component">
  <router-outlet></router-outlet>
</app-loading-page>
