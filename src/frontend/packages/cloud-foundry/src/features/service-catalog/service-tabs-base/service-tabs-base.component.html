<app-page-header [tabs]="tabLinks" tabsHeader="Service" [breadcrumbs]="breadcrumbs">
  <div class="app-page-header">
    {{ serviceLabel$ | async }}
  </div>
  <div class="page-header-right">
    <ng-container *appCfUserPermission="canCreateServiceInstance">
      <button class="btn btn-primary btn-icon" name="add-service-instance" [routerLink]="addServiceInstanceLink"
        [queryParams]="isServiceSpaceScoped$ | async" [disabled]="(hasVisiblePlans$ | async) === false"
        [title]="toolTipText$ | async">
        <span class="material-icons">add</span>
      </button>
    </ng-container>
  </div>
</app-page-header>
<app-loading-page [text]="'Retrieving Service details'" class="router-component">
  <router-outlet></router-outlet>
</app-loading-page>
