<app-page-header [tabs]="tabLinks" tabsHeader="Service" [breadcrumbs]="breadcrumbs">
  <div class="app-page-header">
    {{ serviceLabel() }}
  </div>
  <div class="page-header-right">
    <ng-container *appCfUserPermission="canCreateServiceInstance">
      <button name="add-service-instance" type="button"
        [routerLink]="addServiceInstanceLink"
        [queryParams]="isServiceSpaceScoped()"
        [disabled]="hasVisiblePlans() === false"
        [title]="toolTipText()"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded font-semibold text-sm
               bg-primary text-white hover:bg-opacity-90 transition-all duration-150
               disabled:opacity-50 disabled:cursor-not-allowed">
        <span class="material-icons text-base leading-5">add</span>
        <span>Add Service Instance</span>
      </button>
    </ng-container>
  </div>
</app-page-header>
<app-loading-page [text]="'Retrieving Service details'" class="router-component">
  <router-outlet></router-outlet>
</app-loading-page>
