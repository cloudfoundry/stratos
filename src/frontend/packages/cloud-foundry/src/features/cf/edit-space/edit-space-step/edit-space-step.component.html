<div class="edit-space">
  <form [formGroup]="editSpaceForm" class="stepper-form">
    <app-form-field>
      <input appInput formControlName="spaceName" [(ngModel)]="spaceName" placeholder="Space Name" [appFocus]="true">
      <app-error *ngIf="!validate()">
        A space with this name already exists. Please enter a different one.
      </app-error>
    </app-form-field>
    <app-form-field *ngIf="hasSpaceQuotas$ | async">
      <app-select class="form-control" formControlName="quotaDefinition" placeholder="Quota Definition">
        <app-option [value]="0" *ngIf="hasSpaceQuotas$ | async">None</app-option>
        <app-option *ngFor="let quota of quotaDefinitions$ | async" [value]="quota.metadata.guid">{{ quota.entity.name }}
        </app-option>
      </app-select>
    </app-form-field>
    <div class="edit-space__stepper-form__ssh">
      <div>
        Toggle SSH access in Space
      </div>
      <div>
        <app-slide-toggle formControlName="toggleSsh">
          <div *ngIf="editSpaceForm.value.toggleSsh">Enabled</div>
          <div *ngIf="!editSpaceForm.value.toggleSsh">Disabled</div>
        </app-slide-toggle>
      </div>
    </div>
  </form>
</div>
