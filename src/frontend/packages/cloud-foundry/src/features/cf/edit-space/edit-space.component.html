<div class="edit-space-stepper">
  <app-page-header>
    Edit {{spaceName$ | async}}
  </app-page-header>
  <app-steppers [cancel]="spaceUrl">
    <app-step title="Edit Space" [signalHandle]="step1.signalHandle" cancelButtonText="Cancel" finishButtonText="Update">
      <app-edit-space-step #step1 [redirectUrl]="spaceUrl"></app-edit-space-step>
    </app-step>
  </app-steppers>
</div>
