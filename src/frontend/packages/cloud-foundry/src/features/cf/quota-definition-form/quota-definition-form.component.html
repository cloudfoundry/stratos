<form [formGroup]="formGroup" class="stepper-form">
  <app-form-field>
    <input appInput formControlName="name" placeholder="Quota Name" required [appFocus]="true">
    @if (formGroup.controls.name?.hasError('nameTaken')) {
      <app-error>
        A quota with this name already exists. Please enter a different one.
      </app-error>
    }
  </app-form-field>
  <app-form-field>
    <input type="number" appInput formControlName="memoryLimit"
      placeholder="Total amount of memory an organization can have" required>
    <span matSuffix>MB</span>
  </app-form-field>
  <app-unlimited-input name="instanceMemoryLimit"
  placeholder="Max amount of memory an app instance can have" suffix="MB" [required]="true"></app-unlimited-input>

  <app-unlimited-input name="appInstanceLimit" placeholder="Total number of application instances"
  [required]="true"></app-unlimited-input>
  <app-unlimited-input name="appTasksLimit" placeholder="Total number of tasks that can be run per app">
  </app-unlimited-input>

  <app-unlimited-input name="totalServices"
  placeholder="Total number of service instances an organization can have" [required]="true"></app-unlimited-input>
  <app-unlimited-input name="totalServiceKeys"
  placeholder="Total number of service keys an organization can have"></app-unlimited-input>

  <app-unlimited-input name="totalRoutes" placeholder="Total number of routes" [required]="true">
  </app-unlimited-input>
  <app-unlimited-input name="totalReservedRoutePorts"
  placeholder="Max number of routes with reserved ports"></app-unlimited-input>
  <app-unlimited-input name="totalPrivateDomains" placeholder="Total number of private domains">
  </app-unlimited-input>

  <app-checkbox appInput formControlName="nonBasicServicesAllowed">Can provision instances of paid service plans
  </app-checkbox>
</form>
