<div class="add-org">
  <div>Specify the name of the new organization</div>
  <form [formGroup]="addOrg" class="stepper-form">
    <app-form-field>
      <input appInput formControlName="orgName" placeholder="Organization Name" required [appFocus]="true">
      <app-error *ngIf="orgName.hasError('nameTaken')">
        An organization with this name already exists. Please enter a different one.
      </app-error>
    </app-form-field>
    <app-form-field>
      <app-select formControlName="quotaDefinition" class="form-control" placeholder="Quota Definition">
        <app-option *ngFor="let quota of quotaDefinitions$ | async" [value]="quota.metadata.guid">{{ quota.entity.name }}</app-option>
      </app-select>
    </app-form-field>
  </form>
</div>
