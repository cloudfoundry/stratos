<div class="add-org">
  <div>Specify the name of the new organization</div>
  <form [formGroup]="addOrg" class="stepper-form">
    <app-form-field>
      <input class="w-full placeholder:!text-transparent focus:outline-none" appInput formControlName="orgName" placeholder="Organization Name" required [appFocus]="true">
      @if (orgName.hasError('nameTaken')) {
        <app-error>
          An organization with this name already exists. Please enter a different one.
        </app-error>
      }
    </app-form-field>
    <app-form-field>
      <app-select formControlName="quotaDefinition" class="form-control" placeholder="Quota Definition" [autoSelectSingleOption]="false">
        <app-option [value]="null">None</app-option>
        @for (quota of quotaSource.value(); track quota.guid) {
          <app-option [value]="quota.guid">{{ quota.name }}</app-option>
        }
      </app-select>
    </app-form-field>
  </form>
</div>
