<div class="edit-org">
  <form [formGroup]="editOrgName" class="stepper-form">
    <app-form-field>
      <input appInput formControlName="orgName" placeholder="Organization Name" required [appFocus]="true">
      <app-error *ngIf="!validate()">
        An organization with this name already exists. Please enter a different one.
      </app-error>
    </app-form-field>
    <app-form-field>
      <app-select class="form-control" formControlName="quotaDefinition" placeholder="Quota Definition">
        <app-option *ngFor="let quota of quotaDefinitions$ | async" [value]="quota.metadata.guid">
          {{ quota.entity.name }}</app-option>
      </app-select>
    </app-form-field>
    <!-- See permission `cfCurrentUserPermissions.ORGANIZATION_SUSPEND` -->

          <div *ngIf="!status ">Suspend</div>
        </app-slide-toggle>
      </div>

    </div> -->
  </form>
</div>
