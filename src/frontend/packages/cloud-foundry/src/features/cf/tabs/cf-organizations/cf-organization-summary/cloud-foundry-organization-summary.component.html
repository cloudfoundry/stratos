<app-page-sub-nav>
  <button aria-label="Edit Organization" class="btn btn-icon" name="edit-org" data-test="org-edit" *appCfUserPermission="permsOrgEdit;endpointGuid:cfEndpointService.cfGuid"
    routerLink="/cloud-foundry/{{cfEndpointService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/edit-org"
    matTooltip="Edit Organization">
    <span aria-hidden="true" class="material-icons">mode_edit</span>
  </button>
  <button aria-label="Delete Organization" class="btn btn-icon" name="delete" data-test="org-delete"
    *appCfUserPermission="permsOrgDelete;endpointGuid:cfOrgService.cfGuid;organizationGuid:cfOrgService.orgGuid;"
    (click)="deleteOrgWarn()" matTooltip="Delete Organization">
    <span aria-hidden="true" class="material-icons">delete</span>
  </button>
  <app-cf-cli-menu tab="summary"></app-cf-cli-menu>
  <app-polling-indicator class="ml-auto"
    [manualPoll]="cfOrgService.loadingApps() === false"
    [isPolling]="cfOrgService.loadingApps()"
    (poll)="cfOrgService.fetchApps()">
  </app-polling-indicator>
</app-page-sub-nav>
<div>
  <app-tile-grid [fit]="true">
    <app-tile-group class="tile-group-1-cols">
      <app-tile>
        <app-card-cf-org-user-details>
        </app-card-cf-org-user-details>
      </app-tile>
    </app-tile-group>
    <app-loading-page [isLoading]="detailsLoading()" text="Retrieving details">
      <app-tile-group class="tile-group-4-cols">
        <app-tile>
          <app-card-number-metric
            link="/cloud-foundry/{{cfOrgService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/spaces" iconFont="stratos-icons" icon="virtual_space"
            label="Spaces" labelSingular="Space" value="{{ cfOrgService.spaces()?.length }}">
          </app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric [link]="appLink" icon="apps" label="Applications" labelSingular="Application"
          value="{{ appCount() }}"></app-card-number-metric>
        </app-tile>
        @if (cfEndpointService.hasApps()) {
          <app-tile>
            <app-card-number-metric icon="application_instance" iconFont="stratos-icons" label="App Instances"
              value="{{ cfOrgService.appInstances() }}"
            limit="{{ quota()?.totalInstances }}"></app-card-number-metric>
          </app-tile>
        }
        <app-tile>
          <app-card-number-metric iconFont="stratos-icons" icon="route" label="Routes"
            value="{{ routesCount() }}"
          limit="{{ quota()?.totalRoutes }}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric
            link="/cloud-foundry/{{cfOrgService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/users" icon="person"
          label="Users" labelSingular="User" value="{{ cfOrgService.usersCount() }}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric icon="domain" label="Private Domains"
            value="{{ privateDomainCount() }}"
          limit="{{ quota()?.totalDomains }}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric iconFont="stratos-icons" icon="service_instance" label="Service Instances"
            value="{{ cfOrgService.serviceInstancesCount() }}"
          limit="{{ quota()?.totalServiceInstances }}"></app-card-number-metric>
        </app-tile>
        @if ((userProvidedServiceInstancesCount() ?? 0) > 0) {
          <app-tile>
            <app-card-number-metric iconFont="stratos-icons" icon="service_instance" label="User Service Instances"
            value="{{ userProvidedServiceInstancesCount() }}"></app-card-number-metric>
          </app-tile>
        }
        @if (cfEndpointService.hasApps()) {
          <app-tile>
            <app-card-number-metric icon="memory" label="Memory Usage" units="mb"
              value="{{ cfOrgService.totalMem() }}"
            limit="{{ quota()?.totalMemoryInMB }}"></app-card-number-metric>
          </app-tile>
        }
      </app-tile-group>
      <app-tile-group class="tile-group-1-cols">
        <app-tile>
          @if (!detailsLoading() && cfOrgService.apps(); as apps) {
            <app-card-cf-recent-apps [allApps$]="apps"
              [endpoint]="cfEndpointService.cfGuid"
            [loading$]="cfOrgService.loadingApps()" (refresh)="cfOrgService.fetchApps()"></app-card-cf-recent-apps>
          }
        </app-tile>
      </app-tile-group>
    </app-loading-page>
  </app-tile-grid>
</div>
