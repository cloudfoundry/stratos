<app-page-sub-nav>
  <button class="btn btn-icon" name="edit-org" *appCfUserPermission="permsOrgEdit;endpointGuid:cfEndpointService.cfGuid"
    routerLink="/cloud-foundry/{{cfEndpointService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/edit-org"
    matTooltip="Edit Organization">
    <span class="material-icons">mode_edit</span>
  </button>
  <button class="btn btn-icon" name="delete"
    *appCfUserPermission="permsOrgDelete;endpointGuid:cfOrgService.cfGuid;organizationGuid:cfOrgService.orgGuid;"
    (click)="deleteOrgWarn()" matTooltip="Delete Organization">
    <span class="material-icons">delete</span>
  </button>
  <button class="btn btn-icon" name="cli"
    routerLink="/cloud-foundry/{{cfEndpointService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/cli"
    matTooltip="CLI Info">
    <span class="material-icons">keyboard</span>
  </button>
  <app-polling-indicator class="ml-auto"
    [manualPoll]="(cfOrgService.loadingApps$ | async) === false"
    [isPolling]="(cfOrgService.loadingApps$ | async)"
    (poll)="cfOrgService.fetchApps()">
  </app-polling-indicator>
</app-page-sub-nav>
<div>
  <app-tile-grid fit="true">
    <app-tile-group class="tile-group-1-cols">
      <app-tile>
        <app-card-cf-org-user-details>
        </app-card-cf-org-user-details>
      </app-tile>
    </app-tile-group>
    <app-loading-page [isLoading]="detailsLoading$" text="Retrieving details">
      <app-tile-group class="tile-group-4-cols">
        <app-tile>
          <app-card-number-metric
            link="/cloud-foundry/{{cfOrgService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/spaces" iconFont="stratos-icons" icon="virtual_space"
            label="Spaces" labelSingular="Space" value="{{ (cfOrgService.spaces$ | async)?.length }}">
          </app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric [link]="appLink" icon="apps" label="Applications" labelSingular="Application"
          value="{{ cfOrgService.appCount$ | async }}"></app-card-number-metric>
        </app-tile>
        @if (cfEndpointService.hasApps$ | async) {
          <app-tile>
            <app-card-number-metric icon="application_instance" iconFont="stratos-icons" label="App Instances"
              value="{{ (cfOrgService.appInstances$ | async) }}"
            limit="{{ (cfOrgService.quotaDefinition$ | async)?.app_instance_limit}}"></app-card-number-metric>
          </app-tile>
        }
        <app-tile>
          <app-card-number-metric iconFont="stratos-icons" icon="route" label="Routes"
            value="{{ (cfOrgService.routesCount$ | async) }}"
          limit="{{ (cfOrgService.quotaDefinition$ | async)?.total_routes}}"></app-card-number-metric>
        </app-tile>
      </app-tile-group>
      <app-tile-group class="tile-group-auto">
        <app-tile>
          <app-card-number-metric
            link="/cloud-foundry/{{cfOrgService.cfGuid}}/organizations/{{cfOrgService.orgGuid}}/users" icon="person"
          label="Users" labelSingular="User" value="{{(cfOrgService.usersCount$ | async)}}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric icon="domain" label="Private Domains"
            value="{{ (cfOrgService.privateDomains$ | async)?.length }}"
          limit="{{ (cfOrgService.quotaDefinition$ | async)?.total_private_domains}}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric iconFont="stratos-icons" icon="service_instance" label="Service Instances"
            value="{{ cfOrgService.serviceInstancesCount() }}"
          limit="{{ (cfOrgService.quotaDefinition$ | async)?.total_services }}"></app-card-number-metric>
        </app-tile>
        @if ((cfOrgService.userProvidedServiceInstancesCount$ | async) > 0) {
          <app-tile>
            <app-card-number-metric iconFont="stratos-icons" icon="service_instance" label="User Service Instances"
            value="{{ (cfOrgService.userProvidedServiceInstancesCount$ | async) }}"></app-card-number-metric>
          </app-tile>
        }
        @if (cfEndpointService.hasApps$ | async) {
          <app-tile>
            <app-card-number-metric icon="memory" label="Memory Usage" units="mb"
              value="{{ (cfOrgService.totalMem$ | async) }}"
            limit="{{ (cfOrgService.quotaDefinition$ | async)?.memory_limit }}"></app-card-number-metric>
          </app-tile>
        }
      </app-tile-group>
      <app-tile-group class="tile-group-1-cols">
        <app-tile>
          @if ((detailsLoading$ | async) === false) {
            <app-card-cf-recent-apps [allApps$]="cfOrgService.apps$"
              [endpoint]="cfEndpointService.cfGuid"
            [loading$]="cfOrgService.loadingApps$" (refresh)="cfOrgService.fetchApps()"></app-card-cf-recent-apps>
          }
        </app-tile>
      </app-tile-group>
    </app-loading-page>
  </app-tile-grid>
</div>
