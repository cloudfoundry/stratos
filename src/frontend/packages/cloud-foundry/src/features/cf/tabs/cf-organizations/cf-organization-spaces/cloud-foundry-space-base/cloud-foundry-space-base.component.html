<app-page-header [breadcrumbs]="breadcrumbs()" [tabs]="tabLinks()" tabsHeader="Space"
  [favorite]="favorite()">
  <h1>{{ spaceDataService.space()?.name }}</h1>
</app-page-header>
<!-- Every tab offers the CF CLI menu; a tab with its own sub-nav (Summary) shows that one instead. -->
<app-page-sub-nav>
  <app-cf-cli-menu></app-cf-cli-menu>
</app-page-sub-nav>
<app-loading-page [isLoading]="isLoading()"
  text="Retrieving space">
  <router-outlet></router-outlet>
</app-loading-page>
