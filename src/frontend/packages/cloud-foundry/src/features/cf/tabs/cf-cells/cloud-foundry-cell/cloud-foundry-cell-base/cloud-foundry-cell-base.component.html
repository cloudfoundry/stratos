<app-page-header tabsHeader="Cell" [breadcrumbs]="breadcrumbs$ | async" [tabs]="tabLinks">
  @if (name$ | async; as name) {
    <h1> Cell: {{ name }}</h1>
  }
</app-page-header>
<app-loading-page [isLoading]="isLoading$" [text]="'Retrieving cell'">
  <router-outlet></router-outlet>
</app-loading-page>
