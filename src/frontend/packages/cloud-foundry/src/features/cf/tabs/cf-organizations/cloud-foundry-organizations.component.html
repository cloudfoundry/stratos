<div class="organizations">
  <app-page-sub-nav>
    @if (canAddOrg$ | async) {
      <button class="btn btn-ghost create" name="add-org"
        routerLink="/cloud-foundry/{{cfEndpointService.cfGuid}}/add-org">
        <span class="create-button-contents">
          <span class="material-icons">add</span> Create
        </span>
      </button>
    }
  </app-page-sub-nav>
  <app-list-view [config]="provider"></app-list-view>
</div>
