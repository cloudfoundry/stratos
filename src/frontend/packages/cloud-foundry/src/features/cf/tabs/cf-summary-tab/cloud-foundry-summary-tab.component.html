<app-page-sub-nav>
  <button class="btn btn-secondary btn-icon" name="cli" routerLink="/cloud-foundry/{{cfEndpointService.cfGuid}}/cli" title="CLI Info">
    <span class="material-icons">terminal</span>
  </button>
  <app-polling-indicator class="ml-auto"
    [manualPoll]="(cfEndpointService.appsLoading$ | async) === false"
    [isPolling]="(cfEndpointService.appsLoading$ | async)"
    (poll)="cfEndpointService.fetchApps()">
  </app-polling-indicator>
</app-page-sub-nav>

<div class="flex h-full min-h-full w-full overflow-y-auto">
  <app-tile-grid fit="true">
    <app-tile-group class="tile-group-1-cols">
      <app-tile>
        <app-card-cf-info></app-card-cf-info>
      </app-tile>
    </app-tile-group>
    <app-loading-page [isLoading]="detailsLoading$" text="Retrieving details">
      <app-tile-group class="tile-group-4-cols">
        <app-tile>
          <app-card-number-metric [link]="appLink" icon="apps" label="Applications" labelSingular="Application"
          value="{{ (cfEndpointService.appCount$ | async) }}"></app-card-number-metric>
        </app-tile>
        <app-tile>
          <app-card-number-metric link="/cloud-foundry/{{cfEndpointService.cfGuid}}/organizations"
            iconFont="stratos-icons" icon="organization" label="Orgs" labelSingular="Org"
          value="{{ (orgCount$ | async) }}"></app-card-number-metric>
        </app-tile>
        @if (cfEndpointService.hasApps$ | async) {
          <app-tile>
            <app-card-number-metric icon="memory" units="mb" label="Memory Usage"
            value="{{ (cfEndpointService.totalMem$ | async) }}"></app-card-number-metric>
          </app-tile>
        }
        <app-tile>
          <app-card-number-metric link="/cloud-foundry/{{cfEndpointService.cfGuid}}/users" icon="person" label="Users"
          labelSingular="User" value="{{ (cfEndpointService.usersCount$ | async) ?? '–' }}"></app-card-number-metric>
        </app-tile>
      </app-tile-group>
      <app-tile-group class="tile-group-1-cols">
        <app-tile>
          @if ((detailsLoading$ | async) === false) {
            <app-card-cf-recent-apps
              [endpoint]="cfEndpointService.cfGuid"
              [allApps$]="cfEndpointService.apps$"
              [loading$]="cfEndpointService.appsLoading$" (refresh)="cfEndpointService.fetchApps()">
            </app-card-cf-recent-apps>
          }
        </app-tile>
      </app-tile-group>
    </app-loading-page>
  </app-tile-grid>
</div>
