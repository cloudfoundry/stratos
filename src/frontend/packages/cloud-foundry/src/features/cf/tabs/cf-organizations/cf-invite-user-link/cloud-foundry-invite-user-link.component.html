@if ((inviteUserDetails$ | async); as inviteUserDetails) {
  <app-card class="mb-3 px-6 py-1.5">
    <app-card-content>
      <div class="flex items-baseline">
        <div class="pr-[5px]">{{inviteUserDetails.text}}</div>
        <button class="btn btn-ghost"
          (click)="inviteUser(inviteUserDetails.url)">Invite
        Users</button>
      </div>
    </app-card-content>
  </app-card>
}
