<app-page-header [breadcrumbs]="breadcrumbs$ | async">
  <h1>CF CLI All</h1>
  <div class="page-header-right">
    <span>
      <button class="btn btn-icon" (click)="back()" matTooltip="Back" aria-label="Back">
        <span class="material-icons">close</span>
      </button>
    </span>
  </div>
</app-page-header>

@if (context$ | async; as context) {
  <app-cli-info [context]="context" [sections]="sections"></app-cli-info>
}
