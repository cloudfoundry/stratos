@if (!(blocked$ | async)) {
  <div class="usernames">
    <div class="usernames__addRemove">
      <div class="flex flex-col gap-3 mb-4">
        <label class="inline-flex items-center cursor-pointer" [class.opacity-50]="!(canAdd$ | async)" [class.pointer-events-none]="!(canAdd$ | async)">
          <input type="radio" [checked]="currentValue === false" (change)="setIsRemove({source: null, value: false})" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 focus:ring-2" [disabled]="!(canAdd$ | async)">
          <span class="ml-2 text-sm font-medium text-gray-900">Add Roles{{(canAdd$ | async) ? '' : ' (Disabled via feature flag)'}}</span>
        </label>
        <label class="inline-flex items-center cursor-pointer" [class.opacity-50]="!(canRemove$ | async)" [class.pointer-events-none]="!(canRemove$ | async)">
          <input type="radio" [checked]="currentValue === true" (change)="setIsRemove({source: null, value: true})" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 focus:ring-2" [disabled]="!(canRemove$ | async)">
          <span class="ml-2 text-sm font-medium text-gray-900">Remove Roles{{(canRemove$ | async) ? '' : ' (Disabled via feature flag)'}}</span>
        </label>
      </div>
    </div>
    <div class="usernames__usernames">
      Provide the user names of the users to update
      <app-stacked-input-actions [stackedActionConfig]="stackedActionConfig" [stateIn$]="stateIn.asObservable()"
        (stateOut)="stateOut($event)">
      </app-stacked-input-actions>
    </div>
    <div class="usernames__origin">
      The UAA origin that the user/s are registered with (Optional)
      <form class="stepper-form">
        <app-form-field>
          <input appInput [(ngModel)]="origin" name="origin" placeholder="Origin">
        </app-form-field>
      </form>
    </div>
  </div>
}
