<app-page-header>
  @if (title$ | async; as title) {
    <span>{{ title }}</span>
  }
</app-page-header>
<app-steppers cancel="{{defaultCancelUrl}}" [nextButtonProgress]="false">
  <app-step title="Confirm" [signalHandle]="confirmStepHandle">
    <app-manage-users-confirm #confirm></app-manage-users-confirm>
  </app-step>
</app-steppers>
