<b>{{ stepperText }}</b>
<form #cfForm="ngForm" class="create-app-step-1 stepper-form">
  <app-form-field *ngIf="!isMarketplaceMode">
    <app-label>Cloud Foundry</app-label>
    <app-select #cfSelect="ngModel" [disabled]="(cfOrgSpaceService.cf.loading$ | async)"
      [ngModel]="cfOrgSpaceService.cf.select.getValue()"
      (selectionChange)="cfOrgSpaceService.cf.select.next($event.value)" required name="cf" [disabled]="isRedeploy"
      [appFocus]="!(cfOrgSpaceService.cf.loading$ | async)">
      <app-option *ngFor="let cf of cfOrgSpaceService.cf.list$ | async" [value]="cf.guid">
        <span>{{ cf.name }}</span>
      </app-option>
    </app-select>
  </app-form-field>
  <app-form-field>
    <app-label>Organization</app-label>
    <app-select #orgSelect="ngModel"
      [disabled]="!cfOrgSpaceService.cf.select.getValue() || (cfOrgSpaceService.org.loading$ | async) || isRedeploy"
      [ngModel]="cfOrgSpaceService.org.select.getValue()"
      (selectionChange)="cfOrgSpaceService.org.select.next($event.value)" required name="org"
      [appFocus]="isMarketplaceMode && !(!cfOrgSpaceService.cf.select.getValue() || (cfOrgSpaceService.org.loading$ | async) || isRedeploy)">
      <app-option *ngFor="let org of cfOrgSpaceService.org.list$ | async" [value]="org.guid">
        <span>{{ org.name }}</span>
      </app-option>
    </app-select>
    <app-error *ngIf="!(hasOrgs$ | async)">
      There are no organizations in this Cloud Foundry
    </app-error>
  </app-form-field>
  <app-form-field>
    <app-label>Space</app-label>
    <app-select #spaceSelect="ngModel"
      [disabled]="!cfOrgSpaceService.org.select.getValue() || (cfOrgSpaceService.space.loading$ | async) || isRedeploy"
      [ngModel]="cfOrgSpaceService.space.select.getValue()"
      (selectionChange)="cfOrgSpaceService.space.select.next($event.value)" required name="space">
      <app-option *ngFor="let space of spaces$ | async" [value]="space.guid">
        <span>{{ space.name }}</span>
      </app-option>
    </app-select>
    <app-error *ngIf="!(hasSpaces$ | async)">
      There are no spaces in this organization
    </app-error>
  </app-form-field>
  <p>Don't see your organization or space? Please make sure you have the relevant permissions.</p>
</form>
