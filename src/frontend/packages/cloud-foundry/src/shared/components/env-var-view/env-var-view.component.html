<div class="flex flex-col">
  <h2 class="dialog-title">
    Environment Variables
  </h2>
  <div class="dialog-content">
    <app-code-block>
      <ng-container>
        <pre class="mb-0">{{data.key}}=@if (!isObject(data.value)) {
          <span>{{data.value}}</span>
        }</pre>
        @if (isObject(data.value)) {
          <pre class="mt-0 whitespace-pre-wrap">{{ data.value | json }}</pre>
        }
      </ng-container>
    </app-code-block>
  </div>

  <div class="dialog-actions flex flex-row-reverse justify-self-start">
    <button class="btn btn-primary" (click)="dialogRef.close()">Close</button>
  </div>
</div>
