<ng-template #json>
  <form [formGroup]="jsonForm">
    <app-form-field class="schema-form__raw">
      <textarea appInput placeholder="JSON" class="min-h-[60px] max-h-[150px] resize-y" formControlName="json"></textarea>
      <app-error *ngIf="jsonForm.controls.json.hasError('notValidJson')">
        Not valid JSON. Please specify a valid JSON Object
      </app-error>
    </app-form-field>
  </form>
</ng-template>

<div *ngIf="mode === 'schema'; else json" class="schema-form">
  <div class="flex gap-4 mb-4">
    <label class="inline-flex items-center cursor-pointer">
      <input type="radio" [(ngModel)]="schemaView" value="schemaForm" (change)="onSchemaViewChanged()" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 focus:ring-2">
      <span class="ml-2 text-sm font-medium text-gray-900">Form</span>
    </label>
    <label class="inline-flex items-center cursor-pointer">
      <input type="radio" [(ngModel)]="schemaView" value="schemaJson" (change)="onSchemaViewChanged()" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 focus:ring-2">
      <span class="ml-2 text-sm font-medium text-gray-900">JSON</span>
    </label>
  </div>

  <div class="schema-form__form" *ngIf="schemaView === 'schemaForm'; else json">
    <json-schema-form loadExternalAssets="false" [options]="{ addSubmit: false }" [schema]="cleanSchema" [framework]="'material-design'" [data]="formInitialData" (validationErrors)="onFormValidationErrors($event)" (onChanges)="onFormChange($event)">
    </json-schema-form>
    <div *ngIf="!!formValidationErrorsStr" class="schema-form__form--data-bad" [innerHTML]="formValidationErrorsStr"></div>
  </div>
</div>
