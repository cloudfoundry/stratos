<div class="p-6 flex flex-col gap-3 min-w-[24rem] max-w-[48rem]">
  <h2 class="dialog-title break-all" data-dialog-drag-handle>{{ data.type }}</h2>
  <div class="dialog-content max-h-[60vh] overflow-auto">
    <!-- Lines keep their shape and scroll; hover or focus wraps them to show everything. -->
    <pre tabindex="0" class="text-xs whitespace-pre overflow-x-auto hover:whitespace-pre-wrap hover:break-words focus:whitespace-pre-wrap focus:break-words bg-content-secondary text-content-text p-3 rounded border border-content-border">{{ data.metadata | json }}</pre>
  </div>
  <div class="dialog-actions flex flex-row-reverse justify-self-start">
    <button class="btn btn-primary" (click)="close()">Close</button>
  </div>
</div>
