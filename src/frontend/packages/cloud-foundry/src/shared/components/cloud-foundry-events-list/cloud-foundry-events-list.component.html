<ng-template #customFilters>
  <form [formGroup]="filtersFormGroup" class="">
    <app-form-field [floatLabel]="'never'">
      <!-- <app-label>Event Type</app-label> -->
      <app-select multiple name="type" formControlName="type" placeholder="Type">
        <app-option *ngFor="let pType of typeValues" [value]="pType">{{pType}}</app-option>
      </app-select>
    </app-form-field>
    <app-form-field *ngIf="showActee" [floatLabel]="'never'">
      <input type="text" appInput name="actee" formControlName="actee" placeholder="Actee's GUID">
      <button class="btn btn-icon" *ngIf="hasActeeFilter" matSuffix aria-label="Clear" (click)="clearActeeFilter()">
        <span class="material-icons">close</span>
      </button>
    </app-form-field>
  </form>
</ng-template>

<app-list [customFilters]="customFilters"></app-list>
