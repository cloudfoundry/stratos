<div class="bind-apps">
  <b>{{guideText}}</b>
  <form class="stepper-form" [formGroup]="stepperForm">
    <app-form-field>
      <app-label>App</app-label>
      <app-select class="form-control" formControlName="apps">
        @if (!boundAppId) {
          <app-option></app-option>
        }
        @for (app of apps$ | async; track app) {
          <app-option [value]="app.metadata.guid">{{ app.entity.name }}</app-option>
        }
      </app-select>
    </app-form-field>
    @if (stepperForm.controls.apps.value) {
      <div class="stepper-form__params">
        <div>Binding Parameters</div>
        <app-schema-form [config]="schemaFormConfig" (dataChange)="setBindingParams($event)" (validChange)="setParamValid($event)"></app-schema-form>
      </div>
    }
  </form>
</div>
