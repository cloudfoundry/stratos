<app-page-sub-nav>
  <div class="flex w-full">
    @if (detail.space(); as space) {
      <div class="flex">
        <ng-container
          *appCfUserPermission="manageAppPermission;spaceGuid:space.guid;endpointGuid:applicationService.cfGuid">
          <app-page-sub-nav-section>
            <button aria-label="Edit" class="btn btn-secondary btn-icon" name="edit"
              routerLink="/applications/{{applicationService.cfGuid}}/{{applicationService.appGuid}}/edit"
              title="Edit">
              <span aria-hidden="true" class="material-icons">edit</span>
            </button>
            <button aria-label="Delete" class="btn btn-danger btn-icon" name="delete" (click)="actions.redirectToDelete()" title="Delete">
              <span aria-hidden="true" class="material-icons">delete</span>
            </button>
          </app-page-sub-nav-section>
          @if (detail.state(); as appState) {
            <!--
              appState.actions is null during the initial load window —
              ApplicationStateService.get() returns the Unknown fallback
              with actions=null when summary/state aren't populated yet.
              Guard the block so Angular doesn't try to read .restart /
              .stop / .start / .restage off null in change-detection.
            -->
            @if (appState.actions; as appActions) {
              <div class="app-page-header__actions">
                <app-page-sub-nav-section>
                  <button aria-label="Restart" class="btn btn-secondary btn-icon" name="restart" [disabled]="isBusy || !appActions.restart"
                    (click)="actions.restart()" title="Restart">
                    <span aria-hidden="true" class="material-icons">refresh</span>
                  </button>
                  @if (appActions.stop) {
                    <button aria-label="Stop" class="btn btn-secondary btn-icon" name="stop" [disabled]="isBusy"
                      (click)="actions.stop()" title="Stop">
                      <span aria-hidden="true" class="material-icons">stop</span>
                    </button>
                  } @else {
                    <button aria-label="Start" class="btn btn-success btn-icon" name="start"
                      [disabled]="isBusy || !appActions.start && !appActions.stop"
                      (click)="actions.start()" title="Start">
                      <span aria-hidden="true" class="material-icons">play_arrow</span>
                    </button>
                  }
                  <button aria-label="Restage" class="btn btn-secondary btn-icon" name="restage" [disabled]="isBusy || !appActions.restage"
                    (click)="actions.restage()" title="Restage">
                    <span aria-hidden="true" class="material-icons">redo</span>
                  </button>
                </app-page-sub-nav-section>
              </div>
            }
          }
        </ng-container>
      </div>
    }
    <app-cli-menu [commands]="cliCommands()" [context]="cliNames()" [allLink]="cliAllLink"></app-cli-menu>
    <a aria-label="Visit" class="flex justify-center btn btn-info btn-icon"
      [class.pointer-events-none]="cannotVisit()" [class.opacity-50]="cannotVisit()"
      href="{{detail.url()}}" target="_blank" title="Visit">
      <span aria-hidden="true" class="material-icons">launch</span>
    </a>
  </div>
</app-page-sub-nav>
