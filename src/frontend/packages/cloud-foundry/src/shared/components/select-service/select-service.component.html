<b>Select the service</b>
<div class="select-service">
  <form class="stepper-form" [formGroup]="stepperForm">
    <app-form-field>
      <app-label>Service</app-label>
      <app-select class="form-control" formControlName="service">
        <app-option *ngFor="let service of services$ | async" [value]="service.metadata.guid">{{ service.entity.label }}</app-option>
      </app-select>
    </app-form-field>
    <app-cf-service-card disableCardClick="true" [row]="selectedService$ | async"></app-cf-service-card>
  </form>
</div>
