@if (serviceInstance.entity.last_operation; as lo) {
  <div>
    <div class="items-center flex pb-[5px]" [ngClass]="alignRight ? 'justify-end' : 'justify-start'">
      {{lo.type | titlecase }}
      @if (lo.state==='in progress') {
        <app-boolean-indicator [ngClass]="alignRight ? 'pl-[5px] pr-0' : 'pr-[5px]'" [isTrue]="true"
        type="progress-progress" [subtle]="false" [showText]="false"></app-boolean-indicator>
      } @else {
        <app-boolean-indicator [ngClass]="alignRight ? 'pl-[5px] pr-0' : 'pr-[5px]'" [isTrue]="lo.state==='succeeded'" type="yes-no" [subtle]="false"
          [showText]="false">
        </app-boolean-indicator>
      }
    </div>
    <div>{{ lo.updated_at | date:'medium' }}</div>
  </div>
}
