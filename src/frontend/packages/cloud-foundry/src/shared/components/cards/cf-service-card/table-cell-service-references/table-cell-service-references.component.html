<!-- The icon link repeats the text link beside it, so it is decoration: out of the tab order and the accessibility tree. -->
<div class="service-card__links">
  @if (hasDocumentationUrl()) {
    <div class="service-card__link">
      <a class="service-card__icon-link" [href]="getDocumentationUrl()" target="_blank" aria-hidden="true" tabindex="-1" appClickStopPropagation>
        <span class="material-icons">launch</span>
      </a>
      <a [href]="getDocumentationUrl()" target="_blank" appClickStopPropagation>Docs</a>
    </div>
  }
  @if (hasSupportUrl()) {
    <div class="service-card__link">
      <a class="service-card__icon-link" [href]="getSupportUrl()" target="_blank" aria-hidden="true" tabindex="-1" appClickStopPropagation>
        <span class="material-icons">launch</span>
      </a>
      <a [href]="getSupportUrl()" target="_blank" appClickStopPropagation>Support</a>
    </div>
  }
</div>
