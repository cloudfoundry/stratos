@let broker = broker$ | async;
@let spaceLink = spaceLink$ | async;

<app-meta-card class="service-broker">
  <app-meta-card-title>
    <div class="service-broker__title__link">Service Broker</div>
  </app-meta-card-title>
  <app-meta-card-item>
    <app-meta-card-item>
      <app-meta-card-key>Name</app-meta-card-key>
      <app-meta-card-value>{{ broker?.name }}</app-meta-card-value>
    </app-meta-card-item>
    <app-meta-card-key>Broker Link</app-meta-card-key>
    <app-meta-card-value>
      <a [href]="broker?.url" target="_blank" appClickStopPropagation>
        <span class="material-icons">launch</span>
      </a>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Auth Username</app-meta-card-key>
    <app-meta-card-value>
      <app-tristate-value
        [value]="broker?.authUsername"
        [unavailable]="broker?._meta?.unavailable?.includes('authUsername') ?? false">
      </app-tristate-value>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Space Scoped</app-meta-card-key>
    <app-meta-card-value>
      <app-boolean-indicator [isTrue]="!!broker?.space?.guid" type="yes-no">
      </app-boolean-indicator>
    </app-meta-card-value>
  </app-meta-card-item>
  @if (broker?.space?.guid && spaceLink) {
    <app-meta-card-item>
      <app-meta-card-key>Space</app-meta-card-key>
      <app-meta-card-value><a [routerLink]="spaceLink.link">{{ spaceLink.name }}</a></app-meta-card-value>
    </app-meta-card-item>
  }
</app-meta-card>
