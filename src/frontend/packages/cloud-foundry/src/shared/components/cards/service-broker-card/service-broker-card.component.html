@let b = broker();
@let sl = spaceLink();

<app-meta-card class="service-broker">
  <app-meta-card-title>
    <div class="service-broker__title__link">Service Broker</div>
  </app-meta-card-title>
  <app-meta-card-item>
    <app-meta-card-key>Name</app-meta-card-key>
    <app-meta-card-value>{{ b?.name }}</app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Broker Link</app-meta-card-key>
    <app-meta-card-value>
      @if (b?.url; as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer" appClickStopPropagation>
          {{ url }}<span class="sr-only"> (opens in a new tab)</span>
          <span class="material-icons align-middle" aria-hidden="true">launch</span>
        </a>
      }
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Auth Username</app-meta-card-key>
    <app-meta-card-value>
      <app-tristate-value
        [value]="$safeNavigationMigration(b?.authUsername)"
        [unavailable]="b?._meta?.unavailable?.includes('authUsername') ?? false"
      >
      </app-tristate-value>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Space Scoped</app-meta-card-key>
    <app-meta-card-value>
      <app-boolean-indicator [isTrue]="!!b?.space?.guid" type="yes-no"> </app-boolean-indicator>
    </app-meta-card-value>
  </app-meta-card-item>
  @if (b?.space?.guid && sl) {
    <app-meta-card-item>
      <app-meta-card-key>Space</app-meta-card-key>
      <app-meta-card-value
        ><a [routerLink]="sl.link">{{ sl.name }}</a></app-meta-card-value
      >
    </app-meta-card-item>
  }
</app-meta-card>
