<div class="card-app-instances custom-card">
  <app-card-status [status$]="status$"></app-card-status>
  <div class="card-header">
    <h2 class="card-title">Instances</h2>
  </div>
  <div class="card-content card-app-instances__compact">
    @if (!isEditing) {
      <div class="card-app-instances__large">
        <app-running-instances [instances]="(appService.application$ | async)?.app.entity?.instances"
          [cfGuid]="appService.cfGuid" [appGuid]="this.appService.appGuid">
        </app-running-instances>
      </div>
    }
    <form [hidden]="!isEditing" class="card-app-instances__form">
      <app-form-field>
        <input #instanceField appInput type="number" name="instances" [(ngModel)]="editValue" value="{{ editCount }}">
      </app-form-field>
    </form>
  </div>
  @if (canEditApp$ | async) {
    @if (showActions && (appService.applicationRunning$ | async) && !isEditing) {
      <div
        class="card-actions card-app-instances__actions">
        <button (click)="edit()" class="btn btn-icon" [disabled]="appService.isUpdatingApp$ | async">
          <span class="material-icons">edit</span>
        </button>
        <button (click)="scaleDown()" class="btn btn-icon" [disabled]="appService.isUpdatingApp$ | async">
          <span class="material-icons">remove_circle_outline</span>
        </button>
        <button (click)="scaleUp()" class="btn btn-icon" [disabled]="appService.isUpdatingApp$ | async">
          <span class="material-icons">add_circle_outline</span>
        </button>
      </div>
    }
    @if (showActions && isEditing) {
      <div class="card-actions card-app-instances__actions">
        <button (click)="finishEdit(false)" class="btn btn-icon" [disabled]="appService.isUpdatingApp$ | async">
          <span class="material-icons">clear</span>
        </button>
        <button (click)="finishEdit(true)" class="btn btn-icon" [disabled]="appService.isUpdatingApp$ | async">
          <span class="material-icons">done</span>
        </button>
      </div>
    }
  }

</div>
