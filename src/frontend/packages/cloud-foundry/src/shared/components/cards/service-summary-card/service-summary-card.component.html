@let v = view();

<app-meta-card>
  <app-meta-card-title>
    <div class="flex flex-row justify-between">
      <div>Summary</div>
    </div>
  </app-meta-card-title>
  <app-meta-card-item customStyle="long-text">
    <app-meta-card-key></app-meta-card-key>
    <app-meta-card-value>
      <span class="leading-normal">
        {{ v.description }}
      </span>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Available</app-meta-card-key>
    <app-meta-card-value>
      <app-boolean-indicator [isTrue]="v.available" type="yes-no">
      </app-boolean-indicator>
    </app-meta-card-value>
  </app-meta-card-item>
  <app-meta-card-item>
    <app-meta-card-key>Shareable</app-meta-card-key>
    <app-meta-card-value>
      <app-boolean-indicator [isTrue]="v.shareable" type="yes-no">
      </app-boolean-indicator>
    </app-meta-card-value>
  </app-meta-card-item>
  @if (v.documentationUrl) {
    <app-meta-card-item>
      <app-meta-card-key>Documentation Link</app-meta-card-key>
      <app-meta-card-value>
        <a [href]="v.documentationUrl" target="_blank" appClickStopPropagation>
          <span class="material-icons">launch</span>
        </a>
      </app-meta-card-value>
    </app-meta-card-item>
  }
  <app-meta-card-item customStyle="column">
    <app-meta-card-key>Tags</app-meta-card-key>
    <app-meta-card-value>
      <app-chips [chips]="v.tags"></app-chips>
    </app-meta-card-value>
  </app-meta-card-item>
</app-meta-card>
