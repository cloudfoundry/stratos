<app-card>
  <app-card-status [status$]="status$"></app-card-status>
  @if (isRunning() && hasUsageData()) {
    <app-card-content>
      <table class="w-full text-sm">
        <tr>
          <td class="py-1 text-content-muted">Usage</td>
          <td class="py-1 text-right" [appTableCellStatus]="statuses().mem">Mem</td>
          <td class="py-1 text-right" [appTableCellStatus]="statuses().disk">Disk</td>
          <td class="py-1 text-right" [appTableCellStatus]="statuses().cpu">CPU</td>
        </tr>
        <tr>
          <td class="py-1 text-content-muted">Max</td>
          <td class="py-1 text-right">{{ max().mem | percentage }}</td>
          <td class="py-1 text-right">{{ max().disk | percentage }}</td>
          <td class="py-1 text-right">{{ max().cpu | percentage }}</td>
        </tr>
        <tr>
          <td class="py-1 text-content-muted">Avg</td>
          <td class="py-1 text-right">{{ avg().mem | percentage }}</td>
          <td class="py-1 text-right">{{ avg().disk | percentage }}</td>
          <td class="py-1 text-right">{{ avg().cpu | percentage }}</td>
        </tr>
      </table>
    </app-card-content>
  }
  @if (!isRunning()) {
    <app-card-content>
      <app-card-header>
        <app-card-title>Application is not running</app-card-title>
      </app-card-header>
    </app-card-content>
  }
</app-card>
