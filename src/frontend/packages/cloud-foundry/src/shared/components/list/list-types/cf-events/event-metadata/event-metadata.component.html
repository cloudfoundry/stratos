@if (isPopup) {
  <div class="details__popup p-6">
    <ng-container *ngTemplateOutlet="showValues">
    </ng-container>
  </div>
  <div class="dialog__actions flex justify-end gap-2 p-4 border-t border-gray-200 dark:border-gray-700">
    <button class="btn btn-ghost">Close</button>
  </div>
} @else {
  @if (showPopup) {
    <div>
      <button class="btn btn-outline" (click)="doShowPopup()">
        Show Details
      </button>
    </div>
  } @else {
    <div class="details">
      @for (metadata of (metadata) | keyvalue; track metadata) {
        <div class="details__section">
          <div class="details__section__key">{{metadata.key}}: </div>
          <div>{{metadata.value | json}}</div>
        </div>
      }
    </div>
  }
}



<ng-template #showValues>
  <div class="details">
    @for (metadata of (metadata) | keyvalue; track metadata) {
      <div class="details__section">
        <div class="details__section__key">{{metadata.key}}: </div>
        <div>{{metadata.value | json}}</div>
      </div>
    }
  </div>
</ng-template>
