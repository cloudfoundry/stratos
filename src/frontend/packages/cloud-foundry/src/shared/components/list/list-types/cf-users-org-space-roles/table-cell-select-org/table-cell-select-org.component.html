<div *ngIf="(singleOrg$ | async); then singleOrg else manyOrgs"></div>
<ng-template #singleOrg>
  <div>{{(singleOrg$ | async)?.entity.name }}</div>
</ng-template>
<ng-template #manyOrgs>
  <app-form-field>
    <app-select #cfSelect="ngModel" [ngModel]="selectedOrgGuid" id="selectOrgGuid"
      (selectionChange)="updateOrg($event.value)" required>
      <app-option *ngFor="let org of organizations$ | async;trackBy:org?.metadata?.guid" [value]="org.metadata.guid">
        {{org.entity.name}}
      </app-option>
    </app-select>
  </app-form-field>
</ng-template>
