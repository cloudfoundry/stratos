@if ((singleOrg$ | async)) {
  <div>{{(singleOrg$ | async)?.entity.name }}</div>
} @else {
  <app-form-field>
    <app-select #cfSelect="ngModel" [ngModel]="selectedOrgGuid" id="selectOrgGuid"
      (selectionChange)="updateOrg($event.value)" required>
      @for (org of organizations$ | async; track org?.metadata?.guid($index, org)) {
        <app-option [value]="org.metadata.guid">
          {{org.entity.name}}
        </app-option>
      }
    </app-select>
  </app-form-field>
}
