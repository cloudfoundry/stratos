@if (isUserProvidedServiceInstance === true) {
  <div>
    <div class="pb-[5px]">User Provided</div>
  </div>
}
@if (isUserProvidedServiceInstance === false) {
  <div>
    <div class="pb-[5px]"><a [routerLink]="serviceUrl$ | async">{{ serviceName$ | async }}</a></div>
    <div class="pb-[5px]">Plan: {{ row.entity.service_plan?.entity.name }}</div>
    <div class="pb-[5px] flex">
      Broker: <app-table-cell-service-broker class="pl-[5px]" [row]="service$ | async" [config]="brokerNameConfig">
    </app-table-cell-service-broker>
  </div>
  <div class="pb-[5px] flex">
    Scope: <app-table-cell-service-broker class="pl-[5px]" [row]="service$ | async" [config]="brokerScopeConfig">
  </app-table-cell-service-broker>
</div>
</div>
}
