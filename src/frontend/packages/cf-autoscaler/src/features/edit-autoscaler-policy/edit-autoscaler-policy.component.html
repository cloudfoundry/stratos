<div class="autoscaler-policy-edit-steppers">
  <app-page-header>
    <h1>{{isCreate ? 'Create' : 'Edit' }} AutoScaler Policy:
      {{ (applicationService.application$ | async)?.app.entity.name }} </h1>
    <div class="page-header-right">
      <button class="btn btn-icon" routerLink="{{parentUrl}}" aria-label="Close">
        <app-custom-icon>clear</app-custom-icon>
      </button>
    </div>
  </app-page-header>
  <app-steppers cancel="{{parentUrl}}">
    <app-step [title]="'Default Instance Limits'" [signalHandle]="step1Handle">
      <app-edit-autoscaler-policy-step1 #step1></app-edit-autoscaler-policy-step1>
    </app-step>
    <app-step [title]="'Scaling Rules'" [signalHandle]="step2Handle">
      <app-edit-autoscaler-policy-step2 #step2></app-edit-autoscaler-policy-step2>
    </app-step>
    <app-step [title]="'Recurring Schedules'" [signalHandle]="step3Handle">
      <app-edit-autoscaler-policy-step3 #step3></app-edit-autoscaler-policy-step3>
    </app-step>
    <app-step [title]="'Specific Dates'" [signalHandle]="step4Handle">
      <app-edit-autoscaler-policy-step4 #step4></app-edit-autoscaler-policy-step4>
    </app-step>
  </app-steppers>
</div>
