<div class="card">
  <div class="card-header">
    <h3 class="card-title">Instances</h3>
  </div>
  <div class="card-content p-4 space-y-4">
    <app-metadata-item label="Current">
      <app-running-instances [instances]="applicationInstances$ | async" [cfGuid]="appService.cfGuid"
        [appGuid]="this.appService.appGuid">
      </app-running-instances>
    </app-metadata-item>
    <div class="grid grid-cols-2 gap-4">
      <app-metadata-item label="Minimum">
        <div *ngIf="appAutoscalerPolicy$ | async as policy" class="text-lg font-semibold">
          {{ policy.instance_min_count }}
        </div>
        <div *ngIf="!(appAutoscalerPolicy$ | async)" class="text-gray-500">-</div>
      </app-metadata-item>
      <app-metadata-item label="Maximum">
        <div *ngIf="appAutoscalerPolicy$ | async as policy" class="text-lg font-semibold">
          {{ policy.instance_max_count }}
        </div>
        <div *ngIf="!(appAutoscalerPolicy$ | async)" class="text-gray-500">-</div>
      </app-metadata-item>
    </div>
  </div>
</div>
