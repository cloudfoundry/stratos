version: 2
updates:
  # Root JS dependencies install with bun; the npm-style default updater
  # edits only package.json and fails the frozen bun.lock CI install.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Angular packages only work in lockstep; one-at-a-time bumps
      # produce mutually incompatible PRs.
      angular:
        patterns:
          - "@angular*"
          - "@schematics/*"
    ignore:
      # TypeScript majors are pinned by Angular's supported range; they move
      # with the framework upgrade, not on their own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The root @angular/build is the copy the Analog Vitest plugin loads.
      # Analog 2.7.2 breaks on 22.2 (analogjs/analog#2575), so it stays on
      # 22.1.x; the application builder has its own nested 22.2 copy.
      # Remove once an Analog release supports @angular/build 22.2.
      - dependency-name: "@angular/build"
        versions: [">=22.2.0"]

  # The devkit package keeps its own npm lockfile.
  - package-ecosystem: "npm"
    directory: "/src/frontend/packages/devkit"
    schedule:
      interval: "weekly"
    groups:
      angular-devkit:
        patterns:
          - "@angular-devkit/*"
          - "@schematics/*"
    ignore:
      # The devkit TypeScript follows the root toolchain's major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
