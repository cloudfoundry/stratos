# CodeQL configuration — currently unused by CI, deliberately.
#
# The Go model pack under stratos-go-models/ declares this project's
# path-confining helpers as path-injection barriers, which cuts the backend's
# path-injection findings from 36 to 6. `make audit codeql` passes it with
# --additional-packs, so a local run gets the benefit.
#
# CI does NOT. Referencing a pack from `packs:` resolves it from a registry
# only — it does not look inside the repository — so wiring this file into
# codeql.yml fails the run outright:
#
#   A fatal error occurred: 'fivetwenty/stratos-go-models' not found in the
#   registry 'https://ghcr.io/v2/'
#
# Making CI use it means publishing the pack to GHCR. Stratos cannot publish
# to ghcr.io/cloudfoundry (see #5763 — no repo has write on that package, and
# the grant needs a cloudfoundry org owner), and publishing under another
# organisation would point this repo's security scanning at a namespace it
# does not control. Until that is resolved the six remaining findings are
# dismissed, as their equivalents already are on develop.
#
# The query suite stays at CodeQL's default either way: setting `queries:`
# here would change what CI runs without changing what runs locally, and the
# two matching is what makes a local result trustworthy.

name: stratos

packs:
  go:
    - fivetwenty/stratos-go-models
