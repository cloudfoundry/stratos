# Barriers CodeQL's Go path-injection query cannot infer on its own.
#
# The query recognises a fixed set of shapes (filepath.Clean("/"+x),
# strings.HasPrefix, filepath.IsLocal, a regexp check, a ".." comparison).
# Jetstream confines path components with its own helpers instead, and a
# custom function is invisible to the query, so every sink downstream is
# reported even though the value reaching it cannot traverse.
#
# Only barrierModel is usable here: TaintedPathCustomizations.qll wires in
# exactly one external hook, `barrierNode(this, "path-injection")`, and has no
# equivalent for barrierGuardModel. A guard that merely returns an error is
# therefore invisible however it is declared — which is why each helper below
# RETURNS the confined value rather than validating in place.
#
# Nothing here weakens a check. The checks live in Go and are tested there;
# this only stops the query re-reporting flows those checks already stop.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # safeSegment maps every character outside [A-Za-z0-9._-] to "_" and
      # collapses an all-dot segment, so its result is always a single inert
      # path component (monocular/cache.go, tested in cache_test.go).
      - ["github.com/cloudfoundry/stratos/src/jetstream/plugins/monocular", "", false, "safeSegment", "", "", "ReturnValue", "path-injection", "manual"]

      # reportPath validates every segment with validateSegment — which rejects
      # "", ".", ".." and anything containing a separator — before joining them
      # beneath reportsDir, and is the only constructor for a report path.
      - ["analyzers", "", false, "reportPath", "", "", "ReturnValue[0]", "path-injection", "manual"]

      # jobFolder confines the nested "user/endpoint/id" job id with
      # filepath.IsLocal before joining it beneath reportsDir.
      - ["analyzers", "", false, "jobFolder", "", "", "ReturnValue[0]", "path-injection", "manual"]
