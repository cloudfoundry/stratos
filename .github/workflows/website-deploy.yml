name: Deploy Website

# Publishes the documentation website (website/ rendering docs/) to GitHub
# Pages on every develop push that touches it. Until the
# stratos.cloudfoundry.org custom domain is set up (CFF/LF infra ticket),
# the site lives at https://cloudfoundry.github.io/stratos/ — hence the
# SITE_URL/SITE_BASE_URL overrides below; once the CNAME lands, change them
# to https://stratos.cloudfoundry.org and /.
# The pages-preview branch is a fork-preview trigger: `make deploy website
# pages` force-pushes HEAD there on a fork, and this workflow publishes the
# fork's Pages site. The job-level guard below keeps that path fork-only —
# the upstream site can only ever publish from develop.
on:
  push:
    branches:
      - develop
      - pages-preview
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

# pages/id-token write live on the deploy job, not here — the build job
# only needs to read the repo.
permissions:
  contents: read

# One Pages deployment at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.3.14'

jobs:
  build:
    name: Build Website
    # pages-preview deploys are fork-only; upstream publishes from develop.
    if: github.ref != 'refs/heads/pages-preview' || github.repository_owner != 'cloudfoundry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: cd website && bun install --frozen-lockfile
      - name: Build website
        run: cd website && bun run build
        env:
          # Owner-derived so the same workflow deploys to a fork's Pages
          # (e.g. for previewing) as well as cloudfoundry.github.io.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
