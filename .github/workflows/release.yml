name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-alpha.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v5.0.0)'
        required: true
        type: string

env:
  NODE_OPTIONS: --max-old-space-size=5500
  NODE_VERSION: '24'
  GO_VERSION: '1.26'
  BUN_VERSION: '1.3.14'

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is_prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
    steps:
      - name: Get version from tag or input
        id: get-version
        # Expressions pass through env rather than interpolating into the
        # script, so a crafted tag or input can't inject shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Release version: ${VERSION}"

      - name: Check if prerelease
        id: check-prerelease
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "🧪 This is a pre-release"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "🚀 This is a production release"
          fi

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history for git archive
          persist-credentials: false

      - name: Setup Node.js
        # setup-node only caches when the `cache:` input is set, which it
        # is not here, so there is no cache to poison on this release path.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Caching is off in this job: restoring a cache that a lower-privilege
      # workflow could have seeded would let poisoned content flow into
      # published release artifacts.
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all (frontend + cross-compile backends)
        env:
          NODE_ENV: production
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: make build all VERSION="$VERSION"

      - name: Verify binaries
        run: |
          echo "🔍 Verifying built binaries..."
          for binary in dist/bin/jetstream-*; do
            echo "✓ $(basename $binary): $(file $binary | cut -d: -f2-)"
          done

      - name: Package release archives
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: make release github VERSION="$VERSION"

      - name: Generate checksums
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: ./build/create-checksums.sh "$VERSION"

      - name: Verify release artifacts
        run: |
          echo "📦 Release artifacts:"
          ls -lh dist/release/
          echo ""
          echo "🔐 Checksums:"
          cat dist/release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/release/*
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-release]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release/

      - name: Extract changelog for version
        id: changelog
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          # Try to extract version-specific changelog
          if [ -f CHANGELOG.md ]; then
            # Extract section between this version and next version header
            NOTES=$(awk "/^## \[?${VERSION#v}\]?/,/^## \[?[0-9]/" CHANGELOG.md | sed '1d;$d' || echo "")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION - See [CHANGELOG.md](CHANGELOG.md) for details."
          fi

          # Save to file for GitHub release
          echo "$NOTES" > /tmp/release-notes.md

          echo "📝 Release notes prepared"

      # gh release create replaces softprops/action-gh-release: same
      # capability, one less third-party action on the release path.
      # --verify-tag makes a workflow_dispatch with a typo'd version fail
      # instead of minting a new tag from the default branch.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-version.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSION" \
            --title "Stratos $VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            $PRERELEASE_FLAG \
            dist/release/*.tar.gz dist/release/*.zip dist/release/SHA256SUMS

      - name: Release summary
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          echo "# 🎉 Release ${VERSION} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Archive | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|------|" >> $GITHUB_STEP_SUMMARY

          cd dist/release
          for file in *.tar.gz *.zip; do
            if [ -f "$file" ]; then
              SIZE=$(ls -lh "$file" | awk '{print $5}')
              echo "| ${file#stratos-${VERSION}-} | $file | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔐 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All release artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  trigger-docker-build:
    name: Trigger Docker Build
    runs-on: ubuntu-latest
    needs: [validate-version, create-github-release]
    if: needs.validate-version.outputs.is_prerelease == 'false'
    permissions:
      actions: write
    steps:
      # gh workflow run replaces actions/github-script: no third-party
      # code and no expression interpolation into a script body.
      - name: Trigger Docker workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" -f version="$VERSION"
          echo "🐳 Docker build triggered for ${VERSION}"
