---

version: 2

# The commit-message prefix is pinned on every ecosystem below, not left to
# Dependabot's default: build/release-notes.sh reads the bumps for a release
# window straight out of the commit log with `--grep '^chore(deps'`, since
# Dependabot opens PRs but never runs the fragment tooling itself. Change a
# prefix here and those bumps stop reaching the release notes.

# Disable Dependabot during Angular
updates:
  # bun ecosystem, not npm: the lockfile is bun.lock (no package-lock.json),
  # so npm-ecosystem PRs edit only package.json and every CI job then fails
  # `bun install --frozen-lockfile` (see PR #5643).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 0 # version updates off; security updates still open PRs
    ignore:
      # Angular releases its packages as one set, and eight package.json files
      # here pin the framework to an exact version -- seven of them as
      # peerDependencies. A single-package bump therefore lands a tree that
      # cannot satisfy its own peer ranges (PRs #5745 and #5746 both did).
      # Move the whole family in one commit instead.
      - dependency-name: "@angular/*"
      - dependency-name: "@angular-devkit/*"

  - package-ecosystem: "bun"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 2
    groups: # one grouped PR so the site's dep tree doesn't dominate the list
      website:
        patterns:
          - "*"
  
  # Every go.mod is listed: `directory` covers one module and gomod does not
  # recurse, so the single src/jetstream entry left the other six unwatched.
  # x/text CVE-2026-56852, x/net CVE-2026-46600 and oras-go CVE-2026-50163
  # all sat in those modules and had to be found with a local trivy run.
  # Keep this list in step with `find src/jetstream -name go.mod`.
  - package-ecosystem: "gomod"
    directories:
      - "/src/jetstream"
      - "/src/jetstream/api"
      - "/src/jetstream/plugins/analysis/container"
      - "/src/jetstream/plugins/cfapppush"
      - "/src/jetstream/plugins/kubernetes"
      - "/src/jetstream/plugins/kubernetes/auth"
      - "/src/jetstream/plugins/monocular"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 0 # GoLang CVE updates being done as part of refactor
    
