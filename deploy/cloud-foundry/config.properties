# Database connectivity environment variables
DATABASE_PROVIDER=sqlite
HTTP_CONNECTION_TIMEOUT_IN_SECS=10
HTTP_CLIENT_TIMEOUT_IN_SECS=30
HTTP_CLIENT_TIMEOUT_MUTATING_IN_SECS=120
# Minutes the browser follows a background operation (a slow service
# broker, a delete) before it stops checking; the operation carries on in
# Cloud Foundry. Defaults to 60; at least 1; over 360 (6 hours) logs a
# warning; 1440 (a day) or more uses 360. On a running app:
# cf set-env console ASYNC_JOB_TRACKING_LIMIT_IN_MINS 120, then restage.
#ASYNC_JOB_TRACKING_LIMIT_IN_MINS=60
SKIP_SSL_VALIDATION=true
CONSOLE_PROXY_TLS_ADDRESS=:443
CONSOLE_CLIENT=console
CF_CLIENT=cf
UAA_ENDPOINT=http://localhost:8080
CONSOLE_ADMIN_SCOPE=stratos.admin
CF_ADMIN_ROLE=cloud_controller.admin
ALLOWED_ORIGINS=http://nginx
SESSION_STORE_SECRET=wheeee!
#CONSOLE_PROXY_CERT_KEY=use local dev-cert/pproxy.key in portal-proxy repo
#CONSOLE_PROXY_CERT=use local dev-cert/pproxy.crt in portal-proxy repo
# ENCRYPTION_KEY must be set explicitly for pre-built binary deployments.
# The old source-buildpack approach defaulted this, but cf push with
# binary_buildpack does not.  Generate one with: openssl rand -hex 32
ENCRYPTION_KEY=B374A26A71490437AA024E4FADD5B497FDFF1A8EA6FF12F6FB65AF2720B59CCF
