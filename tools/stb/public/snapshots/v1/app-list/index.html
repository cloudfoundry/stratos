<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body stb-snapshot-id="cf.applications.page" stba-role="region" stba-description="background color for the applications list page">
    <nav stb-snapshot-id="cf.applications.nav" stba-role="navigation" stba-description="top navigation bar background for the applications page">
      <span class="logo">Stratos</span>
    </nav>
    <main>
      <h1 stb-snapshot-id="cf.applications.heading" stba-role="heading" stba-description="page title text for the applications page">Applications</h1>
      <div class="app-grid">
        <article class="app-card" stb-snapshot-id="cf.applications.app-card-1" stba-role="region" stba-description="card background for an application tile">
          <h2 stb-snapshot-id="cf.applications.app-card-1.heading" stba-role="heading" stba-description="application name heading on a card">Demo App 1</h2>
          <span class="status status-success" stb-snapshot-id="cf.applications.app-card-1.status" stba-role="status" stba-description="status badge color for a running application">Running</span>
        </article>
        <article class="app-card" stb-snapshot-id="cf.applications.app-card-2" stba-role="region" stba-description="card background for an application tile">
          <h2 stb-snapshot-id="cf.applications.app-card-2.heading" stba-role="heading" stba-description="application name heading on a card">Demo App 2</h2>
          <span class="status status-warning" stb-snapshot-id="cf.applications.app-card-2.status" stba-role="status" stba-description="status badge color for a stopped application">Stopped</span>
        </article>
        <article class="app-card" stb-snapshot-id="cf.applications.app-card-3" stba-role="region" stba-description="card background for an application tile">
          <h2 stb-snapshot-id="cf.applications.app-card-3.heading" stba-role="heading" stba-description="application name heading on a card">Demo App 3</h2>
          <span class="status status-danger" stb-snapshot-id="cf.applications.app-card-3.status" stba-role="status" stba-description="status badge color for a crashed application">Crashed</span>
        </article>
      </div>
    </main>
  </body>
</html>
