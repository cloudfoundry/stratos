<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <nav data-stratos-snapshot-id="nav">
      <span class="logo">Stratos</span>
    </nav>

      <div class="app-grid">

        <article class="app-card" data-stratos-snapshot-id="card-2">

          <h2>Demo App 3</h2>
          <span class="status status-danger">Crashed</span>
        </article>
      </div>
