<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <main class="shared-grid">
      <section class="confirm-dialog" stb-snapshot-id="shared.confirm-dialog" stb-kind="dialog">
        <h1 stb-snapshot-id="shared.confirm-dialog.title">Are you sure?</h1>
        <p>This action cannot be undone.</p>
        <div class="actions">
          <button class="btn-secondary">Cancel</button>
          <button class="btn-primary" stb-snapshot-id="shared.confirm-dialog.confirm">Confirm</button>
        </div>
      </section>
      <section class="stepper" stb-snapshot-id="shared.stepper" stb-kind="stepper">
        <div class="steps"><span>1 Details</span><span>2 Review</span><span>3 Done</span></div>
        <div class="step-body">Step content…</div>
        <div class="actions">
          <button class="btn-secondary" stb-snapshot-id="shared.stepper.previous">Previous</button>
          <button class="btn-primary" stb-snapshot-id="shared.stepper.next">Next</button>
        </div>
      </section>
    </main>
  </body>
</html>
