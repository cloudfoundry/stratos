<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <div class="login-container" stb-snapshot-id="auth.login.page">
      <div class="login-bg" stb-snapshot-id="auth.login.background"
           role="img" aria-label="background image for the login page"></div>
      <div class="login-card" stb-snapshot-id="auth.login.card">
        <img class="login-logo" src="logo.svg" stb-snapshot-id="auth.login.logo"
             role="img" aria-label="logo image for the login page" />
        <h1 stb-snapshot-id="auth.login.title">Sign in to Stratos</h1>
        <p class="login-subtitle" stb-snapshot-id="auth.login.subtitle">Multi-cloud management</p>
        <p class="login-message" stb-snapshot-id="auth.login.message">Authorized users only</p>
        <div role="alert" stb-snapshot-id="auth.login.error" aria-label="error/failure message color for the login page"></div>
        <form>
          <label stb-snapshot-id="auth.login.username-label">Username
            <input type="text" stb-snapshot-id="auth.login.username" />
          </label>
          <label stb-snapshot-id="auth.login.password-label">Password
            <input type="password" stb-snapshot-id="auth.login.password" />
          </label>
          <button class="btn-primary" type="submit" stb-snapshot-id="auth.login.sign-in">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
