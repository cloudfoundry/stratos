<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <div class="login-container" data-stratos-snapshot-id="auth.login.page">
      <div class="login-card" data-stratos-snapshot-id="auth.login.card">
        <h1 data-stratos-snapshot-id="auth.login.title">Sign in to Stratos</h1>
        <form>
          <label data-stratos-snapshot-id="auth.login.username-label">Username<input type="text" data-stratos-snapshot-id="auth.login.username" /></label>
          <label>Password<input type="password" /></label>
          <button class="btn-primary" type="submit" data-stratos-snapshot-id="auth.login.sign-in">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
