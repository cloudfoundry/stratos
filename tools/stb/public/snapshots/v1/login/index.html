<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <div class="login-container" stb-snapshot-id="auth.login.page" stb-kind="page">
      <div class="login-bg" stb-snapshot-id="auth.login.page.background"
           role="img" aria-label="background image for the login page"></div>
      <div class="login-card" stb-snapshot-id="auth.login.page.card">
        <img class="login-logo" src="logo.svg" stb-snapshot-id="auth.login.page.card.logo"
             role="img" aria-label="logo image for the login page" />
        <h1 stb-snapshot-id="auth.login.page.card.title">Sign in to Stratos</h1>
        <p class="login-subtitle" stb-snapshot-id="auth.login.page.card.subtitle">Multi-cloud management</p>
        <p class="login-message" stb-snapshot-id="auth.login.page.card.message">Authorized users only</p>
        <div role="alert" stb-snapshot-id="auth.login.page.error" aria-label="error/failure message color for the login page"></div>
        <form>
          <label stb-snapshot-id="auth.login.page.card.username-label">Username
            <input type="text" stb-snapshot-id="auth.login.page.card.username" />
          </label>
          <label stb-snapshot-id="auth.login.page.card.password-label">Password
            <input type="password" stb-snapshot-id="auth.login.page.card.password" />
          </label>
          <button class="btn-primary" type="submit" stb-snapshot-id="auth.login.page.card.sign-in">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
