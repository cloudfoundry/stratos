<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="/preview-shim.js"></script>
  </head>
  <body>
    <div class="login-container" stb-snapshot-id="auth.login.page" stba-role="region" stba-roledescription="page" stba-description="background color for the login page">
      <div class="login-bg" stb-snapshot-id="auth.login.page.background" stba-role="img" stba-description="background image for the login page"
           role="img" aria-label="background image for the login page"></div>
      <div class="login-card" stb-snapshot-id="auth.login.page.card" stba-role="region" stba-description="card background for the login page">
        <img class="login-logo" src="logo.svg" stb-snapshot-id="auth.login.page.card.logo" stba-role="img" stba-description="logo image for the login page"
             role="img" aria-label="logo image for the login page" />
        <h1 stb-snapshot-id="auth.login.page.card.title" stba-role="heading" stba-description="welcome / company greeting heading for the login page">Sign in to Stratos</h1>
        <p class="login-subtitle" stb-snapshot-id="auth.login.page.card.subtitle" stba-role="paragraph" stba-description="subtitle for the login page">Multi-cloud management</p>
        <p class="login-message" stb-snapshot-id="auth.login.page.card.message" stba-role="note" stba-description="custom message for the login page">Authorized users only</p>
        <div role="alert" stb-snapshot-id="auth.login.page.error" stba-role="alert" stba-description="error/failure message color for the login page" aria-label="error/failure message color for the login page"></div>
        <form>
          <label stb-snapshot-id="auth.login.page.card.username-label">Username
            <input type="text" stb-snapshot-id="auth.login.page.card.username" stba-role="textbox" stba-description="input border color for the login fields" />
          </label>
          <label stb-snapshot-id="auth.login.page.card.password-label">Password
            <input type="password" stb-snapshot-id="auth.login.page.card.password" stba-role="textbox" stba-description="input border color for the login fields" />
          </label>
          <button class="btn-primary" type="submit" stb-snapshot-id="auth.login.page.card.sign-in" stba-role="button" stba-description="sign-in button color for the login page">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
